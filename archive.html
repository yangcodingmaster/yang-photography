<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive — Yang Photography</title>

  <!-- ── 分享卡片 + 网站图标 ──────────────────────────────────
       把网址发到微信 / QQ / 微博 / 飞书时，对方看到的是"标题 + 描述 +
       缩略图"的卡片而不是一串光秃秃的网址，靠的就是下面这几行。

       两个容易踩的点：
       1. og:image 和 og:url 必须是完整网址（带 https:// 和域名）——
          微信服务器是拿着它去下载缩略图的，相对路径它找不到；
       2. 微信抓取时不执行 JavaScript，所以这些内容必须写死在 HTML 里，
          不能靠脚本生成（series.html 因此只能用通用文案，
          没法按 ?id= 显示每个系列自己的封面）。

       换域名：python3 scripts/set-domain.py 你的域名
       换缩略图：python3 scripts/make-share-card.sh 见该脚本说明
       ────────────────────────────────────────────────────── -->
  <meta name="description" content="2021 到 2025，那些不成系列却舍不得丢的照片。" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Yang Photography" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="散片档案 · 赵洋摄影" />
  <meta property="og:description" content="2021 到 2025，那些不成系列却舍不得丢的照片。" />
  <meta property="og:url" content="https://yangzhaophoto.com/archive.html" />
  <meta property="og:image" content="https://yangzhaophoto.com/assets/images/share/share-card.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="1200" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />


  <!-- Tailwind 运行时（本地副本）：国内节点访问 cdn.tailwindcss.com 不稳定，
       一旦加载失败整站会退化成没有样式的裸文字，所以放在自己服务器上 -->
  <script src="assets/vendor/tailwind.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'site-bg':      '#fafaf7',
            'site-surface': '#f2f2ef',
            'site-border':  '#e0e0dc',
            'site-text':    '#111111',
            'site-muted':   '#8a8a85',
            'site-accent':  '#111111',
          },
          fontFamily: {
            'display': ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'body':    ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'zh':      ['"Noto Serif SC"', '"Source Han Serif SC"', 'serif'],
          },
        }
      }
    }
  </script>

  <!-- 字体（本地副本）：fonts.googleapis.com 在国内访问不到，在线引用会让
       中英文字体全部回退成系统默认字体。文件由 scripts/fetch-fonts.py 抓取 -->
  <link href="assets/vendor/fonts.css" rel="stylesheet" />

  <style>
    /* ════════════════════════════════════════════════════════
       书架式 Archive：每年是一本书
       书脊 = 扁平竖条（宽度 = 照片数量，数据即造型）；
       hover 展宽露出封面；点击翻开进入逐页阅读视图。
       颜色一律用 Tailwind 的设计变量（写在元素 class 上），
       这里只写几何、层叠和过渡——设计系统仍是唯一的颜色来源。
       ════════════════════════════════════════════════════════ */

    /* ── 锁住页面宽度（防患，与 film.html 同一条修复）──────────────
       书脊展宽和"把选中的书推到屏幕中心"的位移都可能让内容超出视口。
       body 上本来就有 overflow-x-hidden，但 **iOS Safari 只认 body 是不够的**
       ——那边负责滚动的是 html 元素，只给 body 设是出了名的拦不住。

       注：2026-07-26 在手机视口下实测，Archive 目前**没有**发病
       （打开某本书时其余的书会收拢，总宽反而变小）。这行是防患：
       将来照片变多、书脊变宽，或者预览态下多本同时展开就可能撑破。
       film.html 那边是真发病了，同一个原因。 */
    html, body { overflow-x: hidden; }

    /* ── 书架：一排书站在一条极简搁板线上 ── */
    #shelf {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      padding-bottom: 14px;
      /* transform：触屏两步交互里"把选中的书推到屏幕中心"用（JS 计算位移量） */
      transition: opacity 0.4s ease,
                  transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* 打开某本书时，其余的书淡出并收拢宽度——
       被翻开的书自动居中，窄屏上书架也不会瞬间超出屏幕 */
    #shelf.opening .slot:not(.active) {
      opacity: 0;
      width: 0;
      border-color: transparent;
      pointer-events: none;
    }

    /* ── 书脊（slot）：一个扁平竖条 ──
       默认宽度 = 厚度（--t，由 JS 按当年照片数写入）；
       hover / 打开时平面地展宽到封面宽度，邻居被自然挤开。 */
    .slot {
      position: relative;
      width: calc(var(--t) * 1px);
      height: 360px;
      overflow: hidden;
      cursor: pointer;
      transform-origin: 50% 100%;         /* 按压时以"站在搁板上"的底边为支点 */
      transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.4s ease;
    }
    /* hover 展宽只给有光标的设备；触屏走两步交互（.preview 居中预览 → 再点翻开） */
    @media (hover: hover) { .slot:hover { width: 250px; } }
    .slot.active, .slot.preview { width: 250px; }
    /* 极轻的按压态（与 gallery 卡片同款）——有意加的即时反馈，不要"修复"掉 */
    .slot:active { transform: scale(0.99); }

    /* 书脊态：竖排年份，居中 */
    .spine-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.5em;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    @media (hover: hover) { .slot:hover .spine-label { opacity: 0; } }
    .slot.active .spine-label, .slot.preview .spine-label { opacity: 0; }

    /* 封面态：照片图版 + 年份 + 张数（展宽后浮现）
       固定为展开宽度，靠 slot 的 overflow:hidden 裁切，展宽过程中排版不跳动 */
    .cover-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 250px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.35s ease 0.1s;
    }
    @media (hover: hover) { .slot:hover .cover-view { opacity: 1; } }
    .slot.active .cover-view, .slot.preview .cover-view { opacity: 1; }
    .cover-view img {
      width: calc(100% - 48px);
      height: 240px;
      object-fit: cover;
    }

    /* ════════════════════════════════════════════════════════
       阅读视图（reader）：翻开书之后，一次一页
       照片区（上，弹性）+ 页脚区（下，定高）——
       页码永远钉在离底部同一个位置，不随照片比例移动。
       ════════════════════════════════════════════════════════ */
    #reader {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
      display: flex;
      flex-direction: column;
      /* 竖向留给浏览器，横向手势由 fluid.js 接管 */
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }
    #reader.open { opacity: 1; pointer-events: auto; }

    /* 照片区：占满页脚以上的全部空间，照片居中、按剩余空间缩放 */
    .page-photo {
      flex: 1;
      min-height: 0;                      /* 允许 flex 子项收缩，照片才能按区域限高 */
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4.5rem 3rem 0;             /* 顶部让开页头文字 */
    }
    @media (max-width: 640px) { .page-photo { padding: 4rem 1rem 0; } }
    .page-photo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      /* 抓手光标提示"这是能推动的实物"（触摸和鼠标拖拽都由 fluid.js 接管） */
      cursor: grab;
    }

    /* 页脚区：定高贴底。页码贴底边（位置恒定），note 在其上方浮现/消失 */
    .page-footer {
      height: 7.2rem;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 2.4rem;
    }
    #page-note:empty { display: none; }   /* 没写 note 就整行消失 */

    /* 结束卡也可拖拽（用力一甩 = 走出展厅） */
    #view-end { cursor: grab; }

    /* 拖拽进行中（fluid.js 会给 #reader 加这个类）：全局变成抓紧光标 */
    #reader.fluid-grabbing, #reader.fluid-grabbing * {
      cursor: grabbing !important;
    }

    /* 按压态：按下瞬间缩小（无过渡 = 即时反馈），松开 100ms 缓出 */
    .pressable {
      transition: transform 0.1s ease-out;
    }
    .pressable:active {
      transform: scale(0.97);
      transition: none;
    }

    /* 系统开了"减弱动态效果"：书脊不做展宽动画、书架不做居中位移动画，直接到位 */
    @media (prefers-reduced-motion: reduce) {
      .slot   { transition: opacity 0.4s ease; }
      #shelf  { transition: opacity 0.4s ease; }
    }
  </style>
</head>

<!-- overflow-x-hidden：书脊展宽/收拢的过渡瞬间可能短暂超出视口宽度，禁止横向滚动条闪现 -->
<body class="bg-site-bg text-site-text font-body antialiased min-h-screen flex flex-col overflow-x-hidden">

  <!-- 导航栏 -->
  <nav class="fixed top-0 w-full z-50 bg-site-bg">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-display text-xl tracking-wide text-site-text hover:text-site-muted transition-colors">
        Yang
      </a>
      <ul class="flex gap-8 text-sm text-site-muted">
        <li><a href="gallery.html" class="hover:text-site-text transition-colors">Gallery</a></li>
        <li><a href="archive.html" class="text-site-text">Archive</a></li>
        <li><a href="film.html"    class="hover:text-site-text transition-colors">Film</a></li>
        <li><a href="about.html"   class="hover:text-site-text transition-colors">About</a></li>
      </ul>
    </div>
  </nav>

  <div class="h-16"></div>


  <!-- 页面标题 -->
  <header class="max-w-6xl mx-auto px-6 pt-16 pb-8 w-full">
    <h1>
      <span class="block font-display text-4xl tracking-tight">Archive</span>
      <span class="block font-zh text-sm text-site-muted mt-2">散片档案</span>
    </h1>

    <!-- 短分割线：左对齐、不横跨全宽，与标题左缘呼应 -->
    <div class="mt-8 h-px w-20 bg-site-border"></div>
  </header>


  <!-- 书架：每年一本书，由 JS 根据 allArchive 生成 -->
  <main class="flex-1 flex items-center justify-center px-6 pb-16">
    <div id="shelf" class="border-b border-site-border"></div>
  </main>


  <!-- 留言入口：按钮放这儿，点开是一个整屏表单浮层（见 message.js） -->
  <div id="message-slot" data-style="footer" class="pb-16"></div>


  <!-- 阅读视图：翻开书之后，一次一页 -->
  <!-- 背景纯不透明纸面（不加模糊），与 gallery/series 的 Lightbox 一致 -->
  <div id="reader" class="fixed inset-0 z-[100] bg-site-bg">

    <!-- 左上角：这本书是哪一年（结束卡视图里清空） -->
    <div id="reader-title" class="absolute top-6 left-8 text-sm text-site-muted font-display tracking-widest z-10"></div>

    <!-- 出口（右上角）：与 gallery/series 一致的"展览出口"指示牌 -->
    <button id="reader-close"
            class="pressable absolute top-6 right-8 text-xs text-site-muted hover:text-site-text transition-colors tracking-widest z-10">
      → Way out
    </button>

    <!-- 照片区 + 定高页脚（页码位置不随照片比例移动） -->
    <div class="page-photo" id="page-photo">
      <img id="page-img" src="" alt="" draggable="false" class="border border-site-text" />
    </div>
    <div class="page-footer">
      <!-- 自定义文字（data.js 里逐张加 note 字段，没写就整行消失） -->
      <div id="page-note"  class="font-zh text-base text-site-text tracking-wide"></div>
      <!-- 页码：只报"第几页 / 共几页"，年份由左上角负责 -->
      <div id="page-folio" class="mt-2 text-sm text-site-muted tracking-widest"></div>
    </div>

    <!-- 结束卡：看完最后一页再 → 进入此卡，再 → 即合上书，与 series.html 一致 -->
    <div id="view-end" class="absolute inset-0 flex-col items-center justify-center text-center px-12 mx-auto max-w-lg" style="display:none">
      <h2 class="font-zh text-4xl font-light mb-4">游览到此结束</h2>
      <p class="font-display text-site-muted text-lg">Your visit is over</p>
      <p class="mt-16 text-xs text-site-muted opacity-30 tracking-widest">→ Way out</p>
    </div>
  </div>


  <script src="data.js"></script>
  <script src="fluid.js"></script>
  <script src="message.js"></script>
  <script>
    // ── 取出所有年份，按升序（书架从左到右按时间排：2021 → 2025） ──
    var years = Object.keys(allArchive || {}).sort();

    // ══ 第一部分：书架 ══════════════════════════════════════════

    var shelf = document.getElementById('shelf');

    years.forEach(function (year) {
      var photos = allArchive[year];
      // 书脊宽度：底宽 16px + 每张照片 1.6px（数据即造型：一眼看出哪年拍得多）
      var thickness = Math.round(16 + photos.length * 1.6);
      var cover = photos.length ? photos[0].src : '';   // 封面图 = 当年数组第一张

      var slot = document.createElement('div');
      slot.className = 'slot bg-site-surface border border-site-border';
      slot.style.setProperty('--t', thickness);

      slot.innerHTML =
        // 书脊态：竖排年份
        '<div class="spine-label font-display text-site-text">' + year + '</div>' +
        // 封面态：照片图版（与全站同款 1px 描边）+ 年份 + 张数
        '<div class="cover-view">' +
          (cover ? '<img src="' + cover + '" alt="' + year + ' 封面" loading="lazy" class="border border-site-text" />' : '') +
          '<div class="font-display text-2xl tracking-widest mt-4 text-site-text">' + year + '</div>' +
          '<div class="text-xs tracking-widest text-site-muted mt-1">' + photos.length + ' PHOTOS</div>' +
        '</div>';

      // 点击：桌面（有光标）直接翻开；触屏走两步——先居中预览，再点封面才翻开
      slot.addEventListener('click', function () {
        if (isTouchMode() && previewSlot !== slot) {
          previewBook(slot);
          return;
        }
        openBook(year, slot);
      });

      fluidReveal(slot);   // 滚动浮现：书架第一次进入视野时轻轻浮上来（自左而右错开）
      shelf.appendChild(slot);
    });

    // ══ 触屏两步交互：先居中预览，再点封面翻开 ══════════════════
    // 手机上没有 hover，点书脊的第一下 = 把这本书推到屏幕中心展开封面
    // （其他书被挤向两边、超出屏幕的部分被裁掉），再点封面才真正翻开。
    // 桌面（有光标）不走这套：hover 原位预览 + 点击即翻开，
    // 若桌面也做居中位移，书架一动光标底下就换了书，会无限抖动。

    var previewSlot = null;   // 当前居中预览的书（触屏专用）

    // 每次点击时现查设备是否无光标（触屏），不在加载时缓存
    function isTouchMode() {
      return !window.matchMedia('(hover: hover)').matches;
    }

    // 把某本书居中展开预览
    function previewBook(slot) {
      if (previewSlot) previewSlot.classList.remove('preview');
      previewSlot = slot;
      slot.classList.add('preview');
      centerShelfOn(slot);
    }

    // 计算书架需要平移多少，才能让这本书（按展开后的目标宽度）的中心对准屏幕中心
    // 按目标布局直接算，不等动画走完——位移和展宽走同一条缓动曲线，同时到位
    function centerShelfOn(slot) {
      var slots = Array.prototype.slice.call(shelf.children);
      var gap = 8;
      // 每本书的目标宽度：被选中的 = 250，其余 = 各自书脊厚度
      var widths = slots.map(function (s) {
        return (s === slot) ? 250 : parseFloat(s.style.getPropertyValue('--t'));
      });
      var total = widths.reduce(function (a, b) { return a + b; }, 0) + gap * (slots.length - 1);
      var idx = slots.indexOf(slot);
      var before = 0;
      for (var i = 0; i < idx; i++) before += widths[i] + gap;
      // 书架 flex 居中：左缘 = (视口宽 - 总宽) / 2；再平移把书心推到屏心
      var slotCenter = (window.innerWidth - total) / 2 + before + widths[idx] / 2;
      var delta = window.innerWidth / 2 - slotCenter;
      shelf.style.transform = 'translateX(' + delta + 'px)';
    }

    // 收回预览：书架归位，书缩回书脊态
    function clearPreview() {
      if (previewSlot) previewSlot.classList.remove('preview');
      previewSlot = null;
      shelf.style.transform = '';
    }

    // 点书架以外的空白处 = 收回预览（阅读视图打开时不管）
    document.addEventListener('click', function (e) {
      if (!previewSlot) return;
      if (reader.classList.contains('open')) return;
      if (e.target.closest && e.target.closest('.slot')) return;
      clearPreview();
    });

    // ══ 第二部分：阅读视图 ══════════════════════════════════════

    var reader      = document.getElementById('reader');
    var readerTitle = document.getElementById('reader-title');
    var btnClose    = document.getElementById('reader-close');
    var photoArea   = document.getElementById('page-photo');
    var pageImg     = document.getElementById('page-img');
    var pageNote    = document.getElementById('page-note');
    var pageFolio   = document.getElementById('page-folio');
    var viewEnd     = document.getElementById('view-end');

    var currentYear   = null;   // 当前翻开的是哪一年
    var currentPhotos = [];     // 这本书的照片列表
    var currentIndex  = 0;      // 当前看到第几张（等于 length 时是结束卡）
    var activeSlot    = null;   // 书架上被翻开的那本（合上时还原）

    // 翻开一本书：书脊展宽露出封面，其余书淡出收拢，然后淡入阅读视图
    function openBook(year, slot) {
      currentYear   = year;
      currentPhotos = (allArchive[year] || []).slice();
      currentIndex  = 0;
      activeSlot    = slot;
      // 若正处于触屏预览态：交还给 flex 居中（其余书收拢后，翻开的书自然居中）
      clearPreview();
      shelf.classList.add('opening');
      slot.classList.add('active');
      setTimeout(function () {
        swipeControl.reset();   // 清掉上一次遗留的位移/透明度
        updateReader();
        reader.classList.add('open');
        document.body.style.overflow = 'hidden';
      }, 420);
    }

    // 合上书：阅读视图淡出，书架还原（触屏预览态也一并收回——回书架就是回全景）
    function closeBook() {
      swipeControl.reset();     // 中途关闭也要清场，下次打开才干净
      reader.classList.remove('open');
      shelf.classList.remove('opening');
      if (activeSlot) activeSlot.classList.remove('active');
      activeSlot = null;
      clearPreview();
      document.body.style.overflow = '';
    }

    // ✏️═══════════════ 页脚文字怎么自定义（给作者看） ═══════════════
    // 每张照片下面可以写一行自己的话（note 字段），显示在照片和页码之间。
    // 修改位置：data.js → allArchive → 对应年份的数组里，给那张照片加一行 note：
    //
    //   { src: 'assets/images/archive/2023/1.jpeg', alt: '', note: '多佛白崖下的海湾' },
    //
    // 不写 note 就只显示页码，不占位。改完硬刷新（Cmd+Shift+R）即可。
    // ═══════════════════════════════════════════════════════════════

    // 根据 currentIndex 渲染当前页：0..N-1 是照片页，等于 N 时是结束卡
    function updateReader() {
      if (currentIndex === currentPhotos.length) {   // ── 结束卡视图 ──
        photoArea.style.display = 'none';
        pageNote.textContent  = '';
        pageFolio.textContent = '';
        viewEnd.style.display = 'flex';
        readerTitle.textContent = '';                // 结束卡里清空年份（与 series 规矩一致）
        return;
      }
      // ── 照片页 ──
      var p = currentPhotos[currentIndex];
      if (!p) return;
      viewEnd.style.display   = 'none';
      photoArea.style.display = '';
      pageImg.src = p.src;
      pageImg.alt = p.alt || (currentYear + ' 散片');
      pageNote.textContent  = p.note || '';
      pageFolio.textContent = (currentIndex + 1) + ' / ' + currentPhotos.length;
      readerTitle.textContent = currentYear;
    }

    // ── 手势 + 翻页动画：全部交给 fluid.js 的滑动控制器 ──────────
    // 1:1 跟手拖拽（触摸和鼠标都行）、松手按速度决定翻页或弹回、
    // 边界橡皮筋、方向感换图动画；键盘也走同一条动画管路
    var swipeControl = createSwipeControl(reader, {

      // 阅读视图打开着才接管手势
      isActive: function() { return reader.classList.contains('open'); },

      // 当前应该跟手移动的视图：照片本体，或结束卡
      getView: function() {
        return currentIndex === currentPhotos.length ? viewEnd : pageImg;
      },

      // 边界：第一页不能再往回；结束卡不能再往前（往前 = 合上书）
      canPrev: function() { return currentIndex > 0; },
      canNext: function() { return currentIndex < currentPhotos.length; },

      // 真正换内容：改索引 + 重新渲染（控制器保证不会越界调用）
      swap: function(direction) {
        currentIndex += direction;
        updateReader();
      },

      // 合上书：结束卡上用力一甩，或键盘/滑动再往前
      flickClose: closeBook,
    });

    btnClose.addEventListener('click', closeBook);

    // 照片区点击翻页：左半边往回、右半边往后（拖拽松手不算点击）
    photoArea.addEventListener('click', function (e) {
      if (swipeControl.justDragged()) return;
      var rect = photoArea.getBoundingClientRect();
      swipeControl.slide((e.clientX - rect.left) < rect.width / 2 ? -1 : 1);
    });

    // 结束卡点击 = 再往后 = 合上书
    viewEnd.addEventListener('click', function () {
      if (swipeControl.justDragged()) return;
      swipeControl.slide(1);
    });

    // 键盘：Esc 合上书，← → 翻页（同一条动画管路）
    document.addEventListener('keydown', function(e) {
      if (!reader.classList.contains('open')) return;
      if (e.key === 'Escape')     closeBook();
      if (e.key === 'ArrowLeft')  swipeControl.slide(-1);
      if (e.key === 'ArrowRight') swipeControl.slide(1);
    });
  </script>

</body>
</html>
