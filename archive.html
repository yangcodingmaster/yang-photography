<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive — Yang Photography</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'site-bg':      '#fafaf7',
            'site-surface': '#f2f2ef',
            'site-border':  '#e0e0dc',
            'site-text':    '#111111',
            'site-muted':   '#8a8a85',
            'site-accent':  '#111111',
          },
          fontFamily: {
            'display': ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'body':    ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'zh':      ['"Noto Serif SC"', '"Source Han Serif SC"', 'serif'],
          },
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    /* ── 瀑布流：CSS columns，每张图保持原始比例 ── */
    .masonry {
      column-count: 3;
      column-gap: 1rem;
    }
    @media (max-width: 768px) { .masonry { column-count: 2; } }
    @media (max-width: 480px) { .masonry { column-count: 1; } }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      display: block;
      cursor: pointer;
    }

    /* ── Lightbox：纯图模式，无侧栏文字 ── */
    #lightbox {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      /* 竖向留给浏览器，横向手势由 fluid.js 接管 */
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }
    #lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }
    #lightbox-img {
      transform: scale(0.97);
      transition: transform 0.25s ease;
      /* 抓手光标提示"这是能推动的实物"（现在也支持鼠标拖拽了） */
      cursor: grab;
    }
    #lightbox.active #lightbox-img {
      transform: scale(1);
    }
    #view-end {
      cursor: grab;
    }
    /* 拖拽进行中（fluid.js 会给 #lightbox 加这个类）：全局变成抓紧光标 */
    #lightbox.fluid-grabbing, #lightbox.fluid-grabbing * {
      cursor: grabbing !important;
    }
    /* 按压态：按下瞬间缩小（无过渡 = 即时反馈），松开 100ms 缓出 */
    .pressable {
      transition: transform 0.1s ease-out;
    }
    .pressable:active {
      transform: scale(0.97);
      transition: none;
    }
    /* 系统开了"减弱动态效果"：取消开场缩放，只保留淡入 */
    @media (prefers-reduced-motion: reduce) {
      #lightbox-img {
        transform: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body class="bg-site-bg text-site-text font-body antialiased">

  <!-- 导航栏 -->
  <nav class="fixed top-0 w-full z-50 bg-site-bg">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-display text-xl tracking-wide text-site-text hover:text-site-muted transition-colors">
        Yang
      </a>
      <ul class="flex gap-8 text-sm text-site-muted">
        <li><a href="gallery.html" class="hover:text-site-text transition-colors">Gallery</a></li>
        <li><a href="archive.html" class="text-site-text">Archive</a></li>
        <li><a href="about.html"   class="hover:text-site-text transition-colors">About</a></li>
      </ul>
    </div>
  </nav>

  <div class="h-16"></div>


  <!-- 页面标题 + 年份导航 -->
  <header class="max-w-6xl mx-auto px-6 pt-16 pb-8">
    <h1>
      <span class="block font-display text-4xl tracking-tight">Archive</span>
      <span class="block font-zh text-sm text-site-muted mt-2">散片档案</span>
    </h1>

    <!-- 年份小导航：点击切换年份；当前年份用深色，其余浅色 -->
    <nav id="year-nav" class="mt-8 flex flex-wrap gap-6 text-sm">
      <!-- 由 JS 根据 allArchive 的 keys 生成 -->
    </nav>

    <!-- 短分割线：左对齐、不横跨全宽，与标题左缘呼应 -->
    <div class="mt-8 h-px w-20 bg-site-border"></div>
  </header>


  <!-- 瀑布流照片区 -->
  <main class="max-w-6xl mx-auto px-6 py-12">
    <!-- 空状态提示（当某年没有照片时显示） -->
    <p id="empty-hint" class="hidden text-sm text-site-muted text-center py-20">
      这一年还没有照片 / No photos yet
    </p>
    <div id="masonry" class="masonry"></div>

    <!-- 短分割线：居中、不横跨全宽，与底部居中导航呼应 -->
    <div class="mt-16 mx-auto h-px w-20 bg-site-border"></div>

    <!-- 底部年份导航：看完一年滑到底，在这里直接切换下一年（镜像顶部导航） -->
    <nav id="year-nav-bottom" class="mt-8 flex flex-wrap justify-center gap-6 text-sm">
      <!-- 由 JS 渲染，内容与顶部年份导航一致 -->
    </nav>
  </main>


  <!-- Lightbox：纯图模式 -->
  <!-- 背景纯不透明纸面（不加模糊），与 gallery/series 的 Lightbox 一致，不抢照片注意力 -->
  <div id="lightbox" class="fixed inset-0 z-[100] bg-site-bg flex items-center justify-center p-6">
    <!-- 出口（右上角）：与 gallery/series 一致的"展览出口"指示牌，首字母大写 + → 前缀 -->
    <button id="lightbox-close"
            class="pressable absolute top-6 right-8 text-xs text-site-muted hover:text-site-text transition-colors tracking-widest">
      → Way out
    </button>

    <!-- 左右翻页按钮 -->
    <!-- 注意：按压态用 opacity 而不是 .pressable 的 scale——按钮自带 -translate-y-1/2 定位，scale 会覆盖掉它 -->
    <button id="lightbox-prev"
            class="absolute left-6 top-1/2 -translate-y-1/2 text-site-muted hover:text-site-text active:opacity-40 transition-colors text-3xl leading-none px-3 py-2">
      ‹
    </button>
    <button id="lightbox-next"
            class="absolute right-6 top-1/2 -translate-y-1/2 text-site-muted hover:text-site-text active:opacity-40 transition-colors text-3xl leading-none px-3 py-2">
      ›
    </button>

    <!-- 图片本体：尺寸规则与 gallery/series 的 Lightbox 一致 -->
    <!-- 桌面端受 80vh 高度约束 + 居中留白（不铺满全屏），手机端可占更大高度 -->
    <img id="lightbox-img" src="" alt="" draggable="false"
         class="max-h-[85vh] max-w-[90vw] md:max-h-[80vh] md:max-w-4xl object-contain" />

    <!-- 结束卡：看完最后一张再 → 进入此卡，再 → 即走出展厅（关闭），与 series.html 一致 -->
    <div id="view-end" class="flex-col items-center justify-center text-center px-12 max-w-lg" style="display:none">
      <h2 class="font-zh text-4xl font-light mb-4">游览到此结束</h2>
      <p class="font-display text-site-muted text-lg">Your visit is over</p>
      <p class="mt-16 text-xs text-site-muted opacity-30 tracking-widest">→ Way out</p>
    </div>
  </div>


  <script src="data.js"></script>
  <script src="fluid.js"></script>
  <script>
    // ── 取出所有年份，按降序（最新在前） ────────────────────────
    var years = Object.keys(allArchive || {}).sort(function(a, b) {
      return b.localeCompare(a);
    });

    // ── 当前显示的年份（默认最新） ────────────────────────────
    var currentYear = years[0] || null;

    // ── 渲染年份小导航 ────────────────────────────────────────
    // 顶部和底部各有一个容器，内容完全一致：看完一年滑到底，底部也能直接切换
    var yearNav       = document.getElementById('year-nav');
    var yearNavBottom = document.getElementById('year-nav-bottom');

    // 往指定容器里填一组年份按钮（顶部、底部复用同一份逻辑）
    function fillYearNav(container) {
      container.innerHTML = '';
      years.forEach(function(y) {
        var btn = document.createElement('button');
        btn.textContent = y;
        // 当前年份用深色，其余用浅色；都带按压态（按下瞬间反馈）
        btn.className = (y === currentYear)
          ? 'pressable text-site-text font-display tracking-wide'
          : 'pressable text-site-muted hover:text-site-text transition-colors font-display tracking-wide';
        btn.addEventListener('click', function() {
          currentYear = y;
          renderYearNav();
          renderMasonry();
          // 从底部切换年份后，回到顶部重新开始看这一年
          // （系统开了"减弱动态"就直接跳，不做平滑滚动）
          window.scrollTo({ top: 0, behavior: fluidReducedMotion() ? 'auto' : 'smooth' });
        });
        container.appendChild(btn);
      });
    }

    function renderYearNav() {
      fillYearNav(yearNav);
      fillYearNav(yearNavBottom);
    }

    // ── 渲染当前年份的瀑布流 ──────────────────────────────────
    var masonry   = document.getElementById('masonry');
    var emptyHint = document.getElementById('empty-hint');

    // 当前显示的照片列表（用于 Lightbox 翻页）
    var currentPhotos = [];
    var currentIndex  = 0;

    function renderMasonry() {
      masonry.innerHTML = '';
      currentPhotos = (allArchive[currentYear] || []).slice();

      if (currentPhotos.length === 0) {
        emptyHint.classList.remove('hidden');
        return;
      }
      emptyHint.classList.add('hidden');

      currentPhotos.forEach(function(photo, i) {
        var img = document.createElement('img');
        img.src       = photo.src;
        img.alt       = photo.alt || '';
        img.loading   = 'lazy';
        img.className = 'masonry-item w-full';
        img.addEventListener('click', function() { openLightbox(i); });
        fluidReveal(img);   // 滚动浮现：第一次进入视野时从下方轻轻浮上来
        masonry.appendChild(img);
      });
    }

    // ── Lightbox 控制 ────────────────────────────────────────
    var lightbox      = document.getElementById('lightbox');
    var lightboxImg   = document.getElementById('lightbox-img');
    var viewEnd       = document.getElementById('view-end');
    var btnClose      = document.getElementById('lightbox-close');
    var btnPrev       = document.getElementById('lightbox-prev');
    var btnNext       = document.getElementById('lightbox-next');

    // 根据 currentIndex 渲染：0..N-1 显示照片，等于 N（越过最后一张）时显示结束卡
    // 左右箭头始终保留：结束卡上 ← 退回最后一张，→ 走出展厅（关闭）
    function updateLightbox() {
      if (currentIndex === currentPhotos.length) {   // 结束卡视图
        lightboxImg.style.display = 'none';
        viewEnd.style.display     = 'flex';
        return;
      }
      // 照片视图
      var p = currentPhotos[currentIndex];
      if (!p) return;
      viewEnd.style.display     = 'none';
      lightboxImg.style.display = '';
      lightboxImg.src = p.src;
      lightboxImg.alt = p.alt || '';
    }

    function openLightbox(index) {
      currentIndex = index;
      swipeControl.reset();     // 清掉上一次遗留的位移/透明度
      updateLightbox();
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      swipeControl.reset();     // 中途关闭也要清场，下次打开才干净
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }

    // ── 手势 + 翻页动画：全部交给 fluid.js 的滑动控制器 ──────────
    // 1:1 跟手拖拽（触摸和鼠标都行）、松手按速度决定翻页或弹回、
    // 边界橡皮筋、方向感换图动画；‹ › 按钮和键盘也走同一条动画管路
    var swipeControl = createSwipeControl(lightbox, {

      // Lightbox 打开着才接管手势
      isActive: function() { return lightbox.classList.contains('active'); },

      // 当前应该跟手移动的视图：照片本体，或结束卡
      getView: function() {
        return currentIndex === currentPhotos.length ? viewEnd : lightboxImg;
      },

      // 边界：第一张不能再往回；结束卡不能再往前（往前 = 走出展厅）
      canPrev: function() { return currentIndex > 0; },
      canNext: function() { return currentIndex < currentPhotos.length; },

      // 真正换内容：改索引 + 重新渲染（控制器保证不会越界调用）
      swap: function(direction) {
        currentIndex += direction;
        updateLightbox();
      },

      // 走出展厅：结束卡上用力一甩，或按钮/键盘/滑动再往前
      flickClose: closeLightbox,
    });

    btnClose.addEventListener('click', closeLightbox);
    // ‹ › 按钮翻页：走和手势相同的方向动画
    btnPrev.addEventListener('click', function() { swipeControl.slide(-1); });
    btnNext.addEventListener('click', function() { swipeControl.slide(1); });

    // 点 Lightbox 背景（不是图片本身）关闭
    // 拖拽松手落在背景上时不算点击（justDragged 是拖拽后的保险）
    lightbox.addEventListener('click', function(e) {
      if (swipeControl.justDragged()) return;
      if (e.target === lightbox) closeLightbox();
    });

    // 键盘：Esc 关闭，← → 翻页（同一条动画管路）
    document.addEventListener('keydown', function(e) {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape')     closeLightbox();
      if (e.key === 'ArrowLeft')  swipeControl.slide(-1);
      if (e.key === 'ArrowRight') swipeControl.slide(1);
    });

    // ── 初始渲染 ─────────────────────────────────────────────
    if (currentYear) {
      renderYearNav();
      renderMasonry();
    } else {
      // 完全没有年份时显示提示
      emptyHint.classList.remove('hidden');
    }
  </script>

</body>
</html>
