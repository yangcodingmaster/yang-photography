<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品集 / Gallery — Yang Photography</title>

  <!-- ── 分享卡片 + 网站图标 ──────────────────────────────────
       把网址发到微信 / QQ / 微博 / 飞书时，对方看到的是"标题 + 描述 +
       缩略图"的卡片而不是一串光秃秃的网址，靠的就是下面这几行。

       两个容易踩的点：
       1. og:image 和 og:url 必须是完整网址（带 https:// 和域名）——
          微信服务器是拿着它去下载缩略图的，相对路径它找不到；
       2. 微信抓取时不执行 JavaScript，所以这些内容必须写死在 HTML 里，
          不能靠脚本生成（series.html 因此只能用通用文案，
          没法按 ?id= 显示每个系列自己的封面）。

       换域名：python3 scripts/set-domain.py 你的域名
       换缩略图：python3 scripts/make-share-card.sh 见该脚本说明
       ────────────────────────────────────────────────────── -->
  <meta name="description" content="八个系列：从虚焦、湖区，到三年的照片记忆。" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Yang Photography" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:title" content="作品集 · 赵洋摄影" />
  <meta property="og:description" content="八个系列：从虚焦、湖区，到三年的照片记忆。" />
  <meta property="og:url" content="https://www.example.com/gallery.html" />
  <meta property="og:image" content="https://www.example.com/assets/images/share/share-card.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="1200" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />


  <!-- Tailwind 运行时（本地副本）：国内节点访问 cdn.tailwindcss.com 不稳定，
       一旦加载失败整站会退化成没有样式的裸文字，所以放在自己服务器上 -->
  <script src="assets/vendor/tailwind.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'site-bg':      '#fafaf7',
            'site-surface': '#f2f2ef',
            'site-border':  '#e0e0dc',
            'site-text':    '#111111',
            'site-muted':   '#8a8a85',
            'site-accent':  '#111111',
          },
          fontFamily: {
            'display': ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'body':    ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'zh':      ['"Noto Serif SC"', '"Source Han Serif SC"', 'serif'],
          },
        }
      }
    }
  </script>

  <!-- 字体（本地副本）：fonts.googleapis.com 在国内访问不到，在线引用会让
       中英文字体全部回退成系统默认字体。文件由 scripts/fetch-fonts.py 抓取 -->
  <link href="assets/vendor/fonts.css" rel="stylesheet" />
</head>

<body class="bg-site-bg text-site-text font-body antialiased">

  <!-- 导航栏：所有页面统一使用 -->
  <nav class="fixed top-0 w-full z-50 bg-site-bg">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-display text-xl tracking-wide text-site-text hover:text-site-muted transition-colors">
        Yang
      </a>
      <ul class="flex gap-8 text-sm text-site-muted">
        <li><a href="gallery.html" class="text-site-text">Gallery</a></li>
        <li><a href="archive.html" class="hover:text-site-text transition-colors">Archive</a></li>
        <li><a href="film.html"    class="hover:text-site-text transition-colors">Film</a></li>
        <li><a href="about.html"   class="hover:text-site-text transition-colors">About</a></li>
      </ul>
    </div>
  </nav>

  <div class="h-16"></div>


  <!-- 页面标题区 -->
  <header class="max-w-6xl mx-auto px-6 pt-16 pb-12">
    <h1>
      <span class="block font-display text-4xl tracking-tight">Gallery</span>
      <span class="block font-zh text-sm text-site-muted mt-2">作品集</span>
    </h1>
    <!-- 短分割线：左对齐、不横跨全宽，与标题左缘呼应 -->
    <div class="mt-8 h-px w-20 bg-site-border"></div>
  </header>


  <!-- 系列网格：每个方块是一个照片系列（"文件夹"） -->
  <main class="max-w-6xl mx-auto px-6 py-12">
    <div id="series-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- 由下方 JS 根据 data.js 里的 allSeries 渲染 -->
    </div>
  </main>


  <!-- 留言入口：按钮放这儿，点开是一个整屏表单浮层（见 message.js） -->
  <div id="message-slot" data-style="footer" class="pb-24"></div>


  <!-- 先加载数据文件和交互引擎（滚动浮现用），再执行渲染逻辑 -->
  <script src="data.js"></script>
  <script src="fluid.js"></script>
  <script src="message.js"></script>
  <script>
    // 把 allSeries 数组渲染成系列卡片
    var grid = document.getElementById('series-grid');
    allSeries.forEach(function(series) {

      // 创建卡片：点击跳转到 series.html?id=系列ID
      // 注意：没有 hover overlay 等"网页味"悬停动效；但有一个极轻的"按压态"——
      // 按下瞬间缩到 0.99（即时反馈），松开 100ms 缓出。这是有意加的，不要"修复"掉
      var card = document.createElement('a');
      card.href = 'series.html?id=' + series.id;
      card.className = 'block transition-transform duration-100 ease-out active:scale-[0.99] active:duration-0';

      // 拼接年份/地点，空字段自动跳过（避免出现 "2025 ·  · " 这种残缺分隔符）
      var metaParts = [];
      if (series.year)     metaParts.push(series.year);
      if (series.location) metaParts.push(series.location);
      var metaLine = metaParts.join(' &nbsp;·&nbsp; ');

      // 封面图取法：所有系列都用 series.cover 显式指定（不再默认取第一张）
      var coverSrc = series.cover || '';

      card.innerHTML =
        // 封面图片区域：4:3 容器，没有悬停效果（按压反馈在卡片整体上）
        '<div class="relative aspect-[4/3] overflow-hidden bg-site-surface">' +
          '<img src="' + coverSrc + '" alt="' + series.titleZh + ' 封面" class="w-full h-full object-cover" />' +
        '</div>' +

        // 系列信息区：标题（中英）+ 年份地点
        '<div class="mt-4">' +
          '<h2 class="font-zh text-lg font-light">' + series.titleZh + '</h2>' +
          '<p class="font-display text-site-muted text-sm mt-0.5">' + series.titleEn + '</p>' +
          (metaLine ? '<p class="text-xs text-site-muted mt-2 tracking-wide">' + metaLine + '</p>' : '') +
        '</div>';

      fluidReveal(card);   // 滚动浮现：第一次进入视野时从下方轻轻浮上来
      grid.appendChild(card);
    });
  </script>

</body>
</html>
