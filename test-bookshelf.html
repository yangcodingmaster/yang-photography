<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookshelf Test — Archive</title>

  <!-- ⚠️ 这是一个一次性原型页（test），用于验证"书架式 Archive"的视觉与交互。
       确认方向后会把这套东西正式移植进 archive.html，届时删除本文件。 -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    /* ── 设计系统变量（与全站一致） ── */
    :root {
      --bg:      #fafaf7;   /* 页面背景：暖白 */
      --border:  #e0e0dc;   /* 分割线 */
      --text:    #111111;   /* 正文近黑 */
      --muted:   #8a8a85;   /* 辅助文字 */
      --paper:   #f5f2ea;   /* 书封上的"烫字"纸白色 */

      /* 书的几何尺寸（封面宽 / 书高），厚度由每本书的 --t 决定 */
      --bw: 210px;
      --bh: 300px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Cormorant Garamond", Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── 页头：极简，只标注这是个试验页 ── */
    header {
      padding: 2.5rem 3rem 0;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    header p {
      font-family: "Noto Serif SC", serif;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    /* ── 书架区：占满剩余高度，书垂直居中偏下 ── */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 书架：一排书 + 共享透视（共享透视让偏离中心的书有自然的视角偏斜，像真的站在书架前） */
    .shelf {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 7px;
      perspective: 1800px;
      perspective-origin: 50% 38%;
      padding-bottom: 14px;                  /* 书和搁板线之间留一点空隙给影子 */
      border-bottom: 1px solid var(--border);/* 搁板：一条极简的线 */
    }

    /* ── 书位（slot）：书在书架上占的横向空间 ──
       默认宽度 = 书的厚度（只露书脊）；hover 时展开到封面宽度，
       宽度变化会自然把邻居"挤开"，模拟抽书时旁边的书让位。 */
    .slot {
      position: relative;
      width: calc(var(--t) * 1px);
      height: var(--bh);
      transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
      transform-style: preserve-3d;
    }
    .slot:hover { width: var(--bw); }

    /* 书脚下的影子：跟随书位宽度一起变宽 */
    .slot::after {
      content: '';
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: -11px;
      height: 8px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.18), transparent 70%);
      transition: inherit;
    }

    /* ── 书本体：一个 3D 盒子 ──
       默认 rotateY(90deg)：书脊面向观众（正面封面朝向书架深处）；
       hover 时转到 rotateY(16deg)：封面转出来面向你，保留一点角度维持立体感。 */
    .book {
      position: absolute;
      left: 50%;
      top: 0;
      width: var(--bw);
      height: var(--bh);
      margin-left: calc(var(--bw) / -2);
      transform-style: preserve-3d;
      transform: rotateY(90deg);
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .slot:hover .book { transform: rotateY(16deg); }

    /* 3D 盒子的各个面 */
    .face { position: absolute; top: 0; }

    /* 正面封面 & 封底：布面精装，照片像"贴上去的图版"（tipped-in plate） */
    .cover, .backc {
      left: 0;
      width: var(--bw);
      height: var(--bh);
      background-color: var(--cloth);
      /* 极淡的经纬纹理，模拟布面 */
      background-image:
        repeating-linear-gradient(0deg,  rgba(255,255,255,0.045) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.03)        0 1px, transparent 1px 3px);
    }
    .cover { transform: translateZ(calc(var(--t) * 0.5px)); }
    .backc { transform: rotateY(180deg) translateZ(calc(var(--t) * 0.5px)); }

    /* 封面上的照片图版 */
    .cover .plate {
      display: block;
      width: calc(100% - 32px);
      height: 200px;
      margin: 16px auto 0;
      object-fit: cover;
      border: 1px solid rgba(0,0,0,0.35);
    }
    /* 封面下方的年份烫字 */
    .cover .label {
      text-align: center;
      margin-top: 16px;
      color: var(--paper);
    }
    .cover .label .year  { font-size: 1.7rem; font-weight: 500; letter-spacing: 0.12em; line-height: 1.1; }
    .cover .label .count { font-size: 0.8rem; letter-spacing: 0.18em; opacity: 0.75; margin-top: 2px; }

    /* ── 书脊：默认示人的一面 ── */
    .spine {
      left: 50%;
      width: calc(var(--t) * 1px);
      height: var(--bh);
      margin-left: calc(var(--t) * -0.5px);
      transform: rotateY(-90deg) translateZ(calc(var(--bw) / 2));
      background-color: var(--cloth);
      background-image:
        repeating-linear-gradient(0deg,  rgba(255,255,255,0.045) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.03)        0 1px, transparent 1px 3px),
        /* 书脊左右两侧一点点暗部，做出圆脊的错觉 */
        linear-gradient(90deg, rgba(0,0,0,0.18) 0, transparent 18%, transparent 82%, rgba(0,0,0,0.18) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 书脊上下的装帧线（精装书脊常见的两道压线） */
    .spine::before, .spine::after {
      content: '';
      position: absolute;
      left: 15%;
      right: 15%;
      height: 1px;
      background: rgba(245,242,234,0.4);
    }
    .spine::before { top: 26px; box-shadow: 0 4px 0 rgba(245,242,234,0.4); }
    .spine::after  { bottom: 26px; box-shadow: 0 -4px 0 rgba(245,242,234,0.4); }
    /* 书脊上的竖排年份 */
    .spine .year {
      writing-mode: vertical-rl;
      color: var(--paper);
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.45em;
    }

    /* ── 书口：右侧露出的纸页白边（细密的纸纹） ── */
    .edge {
      left: 50%;
      width: calc(var(--t) * 1px);
      height: var(--bh);
      margin-left: calc(var(--t) * -0.5px);
      transform: rotateY(90deg) translateZ(calc(var(--bw) / 2));
      background: repeating-linear-gradient(90deg, #fbfaf5 0 2px, #e6e3d8 2px 3px);
    }
  </style>
</head>
<body>

  <!-- 页头 -->
  <header>
    <h1>Archive</h1>
    <p>散片档案 · 书架原型（test）</p>
  </header>

  <!-- 书架 -->
  <div class="stage">
    <div class="shelf" id="shelf"></div>
  </div>

  <!-- 真实数据 -->
  <script src="data.js"></script>

  <script>
    // ── 每年一本书：从 allArchive 生成书架 ──

    // 每年的布面底色（同一色系里做轻微变化，像一套年鉴合集）
    var clothColors = {
      '2021': '#847d72',
      '2022': '#707668',
      '2023': '#7d6b5c',
      '2024': '#5f6672',
      '2025': '#8b7a67',
    };

    var shelf = document.getElementById('shelf');
    var years = Object.keys(allArchive).sort();   // 2021 → 2025，从左到右按时间排

    years.forEach(function (year) {
      var photos = allArchive[year];
      // 书的厚度：底厚 18px + 每张照片 1.15px（2021 薄、2024 最厚，一眼看出哪年拍得多）
      var thickness = Math.round(18 + photos.length * 1.15);
      var cover = photos[0].src;                  // 封面图 = 当年数组第一张

      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.style.setProperty('--t', thickness);
      slot.style.setProperty('--cloth', clothColors[year] || '#7a756c');

      slot.innerHTML =
        '<div class="book">' +
          '<div class="face cover">' +
            '<img class="plate" src="' + cover + '" alt="' + year + ' 年鉴封面" />' +
            '<div class="label">' +
              '<div class="year">' + year + '</div>' +
              '<div class="count">' + photos.length + ' PHOTOS</div>' +
            '</div>' +
          '</div>' +
          '<div class="face backc"></div>' +
          '<div class="face spine"><span class="year">' + year + '</span></div>' +
          '<div class="face edge"></div>' +
        '</div>';

      // 点击 = 进入那一年（原型阶段先跳回现有 archive 页）
      slot.addEventListener('click', function () {
        window.location.href = 'archive.html';
      });

      shelf.appendChild(slot);
    });
  </script>
</body>
</html>
