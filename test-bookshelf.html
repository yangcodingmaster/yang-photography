<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookshelf Test — Archive</title>

  <!-- ⚠️ 一次性原型页（test）：书架式 Archive 的【扁平版】。
       设计原则：留下书的骨架（书脊排 / 厚度=照片数 / 翻开读页），脱掉书的戏服
       （无 3D、无布纹、无烫金、无阴影），全部用全站已有的印刷品语言来画。
       拟物对照版在 test-bookshelf-3d.html。确认方向后移植进 archive.html，届时删除两个 test 文件。 -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    /* ── 设计系统变量（与全站一致，无新增颜色） ── */
    :root {
      --bg:      #fafaf7;   /* 页面背景：暖白 */
      --surface: #f2f2ef;   /* 卡片/区块背景 */
      --border:  #e0e0dc;   /* 边框、分割线 */
      --text:    #111111;   /* 正文近黑 */
      --muted:   #8a8a85;   /* 辅助文字 */

      /* 书的几何：展开后的封面宽 / 书高；书脊宽由每本的 --t 决定 */
      --bw: 250px;
      --bh: 360px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Cormorant Garamond", Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── 页头：极简，只标注这是个试验页 ── */
    header { padding: 2.5rem 3rem 0; }
    header h1 { font-size: 2rem; font-weight: 500; letter-spacing: 0.02em; }
    header p {
      font-family: "Noto Serif SC", serif;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    /* ── 书架区：占满剩余高度，书居中 ── */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 书架：一排扁平书脊，站在一条极简搁板线上 */
    .shelf {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      transition: opacity 0.4s ease;
    }
    /* 打开某本书时，其余的书淡出让位 */
    .shelf.opening .slot:not(.active) { opacity: 0; pointer-events: none; }

    /* ── 书脊（slot）：一个扁平竖条 ──
       默认宽度 = 厚度（照片越多越宽，数据本身就是造型）；
       hover / 打开时平面地展宽到封面宽度，邻居被自然挤开——
       同一个"抽书让位"的骨架，但没有任何透视表演。 */
    .slot {
      position: relative;
      width: calc(var(--t) * 1px);
      height: var(--bh);
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.4s ease;
    }
    .slot:hover, .slot.active { width: var(--bw); }

    /* ── 书脊态：竖排年份，居中 ── */
    .spine-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.5em;
      color: var(--text);
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    /* 展开后书脊字让位给封面 */
    .slot:hover .spine-label, .slot.active .spine-label { opacity: 0; }

    /* ── 封面态：照片图版 + 年份 + 张数（hover 展开后浮现） ──
       固定为展开宽度，靠 slot 的 overflow:hidden 裁切，避免展宽过程中排版跳动 */
    .cover-view {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--bw);
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.35s ease 0.1s;
    }
    .slot:hover .cover-view, .slot.active .cover-view { opacity: 1; }

    /* 封面照片：与全站照片同一待遇 —— 1px 黑描边 */
    .cover-view img {
      width: calc(100% - 48px);
      height: 240px;
      object-fit: cover;
      border: 1px solid var(--text);
    }
    .cover-view .year {
      margin-top: 18px;
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      line-height: 1;
    }
    .cover-view .count {
      margin-top: 4px;
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      color: var(--muted);
    }

    /* ════════════════════════════════════════════
       阅读视图（reader）：翻开书之后
       版式骨架不变：主页大图 + 页码，右侧露出下一页的窄边；
       "书缝"退化成一根 1px 分割线——版面语言，不是道具语言。
       ════════════════════════════════════════════ */
    #reader {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
      display: flex;
    }
    #reader.open { opacity: 1; pointer-events: auto; }

    /* 主页：当前照片 + 页码 */
    .page-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .page-main img {
      max-width: 78%;
      max-height: 74vh;
      border: 1px solid var(--text);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    /* 页脚：年份 + 页码（folio） */
    .page-main .folio {
      margin-top: 1.4rem;
      font-size: 0.95rem;
      letter-spacing: 0.28em;
      color: var(--muted);
      transition: opacity 0.28s ease;
    }

    /* 书缝：一根细线 */
    .gutter { width: 1px; background: var(--border); }

    /* 右侧微露的下一页：安静地立在线右边，暗示还能翻 */
    .page-peek {
      width: 88px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .page-peek img {
      position: absolute;
      top: 50%;
      left: 24px;
      transform: translateY(-50%);
      height: 60vh;
      max-width: none;
      border: 1px solid var(--text);
    }
    /* 已是最后一页：右侧留白即可 */
    .page-peek.blank img { display: none; }

    /* 翻页动画：方向感的滑动+渐隐（与全站 fluid 语言一致） */
    .page-main.turn-next img   { opacity: 0; transform: translateX(-36px); }
    .page-main.turn-prev img   { opacity: 0; transform: translateX(36px); }
    .page-main.turn-next .folio, .page-main.turn-prev .folio { opacity: 0; }

    /* 出口（与全站 Way out 同构），落在主页区域内 */
    #reader .way-out {
      position: absolute;
      top: 1.6rem;
      right: calc(88px + 1px + 2rem);
      z-index: 2;
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      transition: color 0.25s ease;
    }
    #reader .way-out:hover { color: var(--text); }

    /* 左上角：这本书是哪一年 */
    #reader .book-title {
      position: absolute;
      top: 1.6rem;
      left: 2rem;
      z-index: 2;
      font-size: 1.05rem;
      letter-spacing: 0.24em;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <!-- 页头 -->
  <header>
    <h1>Archive</h1>
    <p>散片档案 · 书架原型 · 扁平版（test）</p>
  </header>

  <!-- 书架 -->
  <div class="stage">
    <div class="shelf" id="shelf"></div>
  </div>

  <!-- 阅读视图：翻开书之后 -->
  <div id="reader">
    <div class="book-title" id="readerTitle"></div>
    <button class="way-out" id="readerExit">&rarr; Back to shelf</button>
    <div class="page-main" id="pageMain">
      <img id="pageImg" src="" alt="" />
      <div class="folio" id="pageFolio"></div>
    </div>
    <div class="gutter"></div>
    <div class="page-peek" id="pagePeek">
      <img id="peekImg" src="" alt="" />
    </div>
  </div>

  <!-- 真实数据 -->
  <script src="data.js"></script>

  <script>
    // ══ 第一部分：从 allArchive 生成书架 ══

    var shelf = document.getElementById('shelf');
    var years = Object.keys(allArchive).sort();   // 2021 → 2025，从左到右按时间排

    years.forEach(function (year) {
      var photos = allArchive[year];
      // 书脊宽度：底宽 16px + 每张照片 1.6px（数据即造型：一眼看出哪年拍得多）
      var thickness = Math.round(16 + photos.length * 1.6);
      var cover = photos[0].src;                  // 封面图 = 当年数组第一张

      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.style.setProperty('--t', thickness);

      slot.innerHTML =
        '<div class="spine-label">' + year + '</div>' +
        '<div class="cover-view">' +
          '<img src="' + cover + '" alt="' + year + ' 封面" />' +
          '<div class="year">' + year + '</div>' +
          '<div class="count">' + photos.length + ' PHOTOS</div>' +
        '</div>';

      // 点击 = 翻开这本书
      slot.addEventListener('click', function () { openBook(year, slot); });

      shelf.appendChild(slot);
    });

    // ══ 第二部分：阅读视图（翻开书之后） ══

    var reader      = document.getElementById('reader');
    var readerTitle = document.getElementById('readerTitle');
    var pageMain    = document.getElementById('pageMain');
    var pageImg     = document.getElementById('pageImg');
    var pageFolio   = document.getElementById('pageFolio');
    var pagePeek    = document.getElementById('pagePeek');
    var peekImg     = document.getElementById('peekImg');

    var currentYear   = null;   // 当前翻开的是哪一年
    var currentIndex  = 0;      // 当前看到第几张
    var activeSlot    = null;   // 书架上被翻开的那本（合上时还原）
    var turning       = false;  // 翻页动画进行中，防连点错乱

    // 翻开：书脊展宽露出封面，其余书淡出，然后淡入阅读视图
    function openBook(year, slot) {
      currentYear  = year;
      currentIndex = 0;
      activeSlot   = slot;
      shelf.classList.add('opening');
      slot.classList.add('active');
      setTimeout(function () {
        renderPage();
        reader.classList.add('open');
      }, 380);
    }

    // 合上：阅读视图淡出，书架还原
    function closeBook() {
      reader.classList.remove('open');
      shelf.classList.remove('opening');
      if (activeSlot) activeSlot.classList.remove('active');
      activeSlot = null;
      currentYear = null;
    }

    // 渲染当前页：主页照片 + 页码 + 右侧下一页的窄边
    function renderPage() {
      var photos = allArchive[currentYear];
      var photo  = photos[currentIndex];
      pageImg.src = photo.src;
      pageImg.alt = photo.alt || (currentYear + ' 散片');
      pageFolio.textContent = currentYear + ' — ' + (currentIndex + 1) + ' / ' + photos.length;
      readerTitle.textContent = currentYear;

      // 下一页预览：还有下一张就露它的边，没有就留白
      var next = photos[currentIndex + 1];
      if (next) {
        pagePeek.classList.remove('blank');
        peekImg.src = next.src;
      } else {
        pagePeek.classList.add('blank');
      }
    }

    // 翻页：dir = +1 往后 / -1 往回。旧页滑出渐隐 → 换内容 → 新页滑入
    function turnPage(dir) {
      if (turning || !currentYear) return;
      var photos = allArchive[currentYear];
      var target = currentIndex + dir;
      if (target < 0 || target >= photos.length) return;   // 到头停住（不循环）

      turning = true;
      pageMain.classList.add(dir > 0 ? 'turn-next' : 'turn-prev');
      setTimeout(function () {
        currentIndex = target;
        renderPage();
        pageMain.classList.remove('turn-next', 'turn-prev');
        turning = false;
      }, 280);
    }

    // 右侧露出的下一页：点它 = 翻过去
    pagePeek.addEventListener('click', function () { turnPage(1); });
    // 主页面左半边点击 = 往回翻，右半边 = 往后翻（正式版会接 fluid.js 手势）
    pageMain.addEventListener('click', function (e) {
      var mid = pageMain.getBoundingClientRect().width / 2;
      turnPage(e.clientX < mid ? -1 : 1);
    });

    document.getElementById('readerExit').addEventListener('click', closeBook);

    // 键盘：← → 翻页，Esc 合上书
    document.addEventListener('keydown', function (e) {
      if (!reader.classList.contains('open')) return;
      if (e.key === 'ArrowRight') turnPage(1);
      if (e.key === 'ArrowLeft')  turnPage(-1);
      if (e.key === 'Escape')     closeBook();
    });
  </script>
</body>
</html>
