<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookshelf Test — Archive</title>

  <!-- ⚠️ 一次性原型页（test）：书架式 Archive 的【扁平版】。
       设计原则：留下书的骨架（书脊排 / 厚度=照片数 / 翻开读页），脱掉书的戏服
       （无 3D、无布纹、无烫金、无阴影），全部用全站已有的印刷品语言来画。
       拟物对照版在 test-bookshelf-3d.html。确认方向后移植进 archive.html，届时删除两个 test 文件。 -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    /* ── 设计系统变量（与全站一致，无新增颜色） ── */
    :root {
      --bg:      #fafaf7;   /* 页面背景：暖白 */
      --surface: #f2f2ef;   /* 卡片/区块背景 */
      --border:  #e0e0dc;   /* 边框、分割线 */
      --text:    #111111;   /* 正文近黑 */
      --muted:   #8a8a85;   /* 辅助文字 */

      /* 书的几何：展开后的封面宽 / 书高；书脊宽由每本的 --t 决定 */
      --bw: 250px;
      --bh: 360px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Cormorant Garamond", Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── 页头：极简，只标注这是个试验页 ── */
    header { padding: 2.5rem 3rem 0; }
    header h1 { font-size: 2rem; font-weight: 500; letter-spacing: 0.02em; }
    header p {
      font-family: "Noto Serif SC", serif;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    /* ── 书架区：占满剩余高度，书居中 ── */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 书架：一排扁平书脊，站在一条极简搁板线上 */
    .shelf {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      transition: opacity 0.4s ease;
    }
    /* 打开某本书时，其余的书淡出让位 */
    .shelf.opening .slot:not(.active) { opacity: 0; pointer-events: none; }

    /* ── 书脊（slot）：一个扁平竖条 ──
       默认宽度 = 厚度（照片越多越宽，数据本身就是造型）；
       hover / 打开时平面地展宽到封面宽度，邻居被自然挤开——
       同一个"抽书让位"的骨架，但没有任何透视表演。 */
    .slot {
      position: relative;
      width: calc(var(--t) * 1px);
      height: var(--bh);
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.4s ease;
    }
    .slot:hover, .slot.active { width: var(--bw); }

    /* ── 书脊态：竖排年份，居中 ── */
    .spine-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: 0.5em;
      color: var(--text);
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    /* 展开后书脊字让位给封面 */
    .slot:hover .spine-label, .slot.active .spine-label { opacity: 0; }

    /* ── 封面态：照片图版 + 年份 + 张数（hover 展开后浮现） ──
       固定为展开宽度，靠 slot 的 overflow:hidden 裁切，避免展宽过程中排版跳动 */
    .cover-view {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--bw);
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.35s ease 0.1s;
    }
    .slot:hover .cover-view, .slot.active .cover-view { opacity: 1; }

    /* 封面照片：与全站照片同一待遇 —— 1px 黑描边 */
    .cover-view img {
      width: calc(100% - 48px);
      height: 240px;
      object-fit: cover;
      border: 1px solid var(--text);
    }
    .cover-view .year {
      margin-top: 18px;
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      line-height: 1;
    }
    .cover-view .count {
      margin-top: 4px;
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      color: var(--muted);
    }

    /* ════════════════════════════════════════════
       阅读视图（reader）：翻开书之后
       一次一页：大图 + 页脚文字，没有下一页预览（试过，动画不连贯）。
       ════════════════════════════════════════════ */
    #reader {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--bg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease;
      display: flex;
    }
    #reader.open { opacity: 1; pointer-events: auto; }

    /* 主页：照片区（上，弹性）+ 页脚区（下，定高）
       页脚定高的意义：无论横图竖图，页码永远钉在离底部同一个位置，
       切换照片时页脚纹丝不动，只有照片在自己的区域里变化。 */
    .page-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* 照片区：占满页脚以上的全部空间，照片在其中居中、按剩余空间缩放 */
    .page-photo {
      flex: 1;
      min-height: 0;                      /* 允许 flex 子项收缩，照片才能按区域限高 */
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4.5rem 3rem 0;             /* 顶部让开页头文字 */
    }
    .page-photo img {
      max-width: 100%;
      max-height: 100%;
      border: 1px solid var(--text);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    /* ── 页脚文字区（定高，钉在底部） ──
       从下往上排：页码永远贴着页脚区底边（位置恒定），
       note 出现在页码上方，出现/消失都不会推动页码。
       ✏️ 自定义文字在 data.js 的 allArchive 里逐张添加 note 字段，
          写法见本文件底部 renderPage() 上方的说明注释。 */
    .page-footer {
      height: 7.2rem;                     /* 定高：页脚区不随内容伸缩 */
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;          /* 内容贴底：页码钉死，note 往上长 */
      padding-bottom: 2.4rem;
    }
    .page-footer .note {
      font-family: "Noto Serif SC", serif;   /* 中文用衬线，与全站一致 */
      font-size: 1rem;
      letter-spacing: 0.08em;
      color: var(--text);
      transition: opacity 0.28s ease;
    }
    .page-footer .note:empty { display: none; }  /* 没写 note 就整行消失 */
    .page-footer .folio {
      margin-top: 0.6rem;
      font-size: 0.9rem;
      letter-spacing: 0.28em;
      color: var(--muted);
      transition: opacity 0.28s ease;
    }

    /* 翻页动画：方向感的滑动+渐隐（与全站 fluid 语言一致） */
    .page-main.turn-next img   { opacity: 0; transform: translateX(-36px); }
    .page-main.turn-prev img   { opacity: 0; transform: translateX(36px); }
    .page-main.turn-next .note,  .page-main.turn-prev .note,
    .page-main.turn-next .folio, .page-main.turn-prev .folio { opacity: 0; }

    /* 出口（与全站 Way out 同构） */
    #reader .way-out {
      position: absolute;
      top: 1.6rem;
      right: 2rem;
      z-index: 2;
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      transition: color 0.25s ease;
    }
    #reader .way-out:hover { color: var(--text); }

    /* 左上角：这本书是哪一年 */
    #reader .book-title {
      position: absolute;
      top: 1.6rem;
      left: 2rem;
      z-index: 2;
      font-size: 1.05rem;
      letter-spacing: 0.24em;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <!-- 页头 -->
  <header>
    <h1>Archive</h1>
    <p>散片档案 · 书架原型 · 扁平版（test）</p>
  </header>

  <!-- 书架 -->
  <div class="stage">
    <div class="shelf" id="shelf"></div>
  </div>

  <!-- 阅读视图：翻开书之后 -->
  <div id="reader">
    <div class="book-title" id="readerTitle"></div>
    <button class="way-out" id="readerExit">&rarr; Back to shelf</button>
    <div class="page-main" id="pageMain">
      <!-- 照片区：占满页脚以上的空间，照片居中 -->
      <div class="page-photo">
        <img id="pageImg" src="" alt="" />
      </div>
      <!-- 页脚区：定高贴底，切换照片时位置恒定 -->
      <div class="page-footer">
        <div class="note" id="pageNote"></div>
        <div class="folio" id="pageFolio"></div>
      </div>
    </div>
  </div>

  <!-- 真实数据 -->
  <script src="data.js"></script>

  <script>
    // ══ 第一部分：从 allArchive 生成书架 ══

    var shelf = document.getElementById('shelf');
    var years = Object.keys(allArchive).sort();   // 2021 → 2025，从左到右按时间排

    years.forEach(function (year) {
      var photos = allArchive[year];
      // 书脊宽度：底宽 16px + 每张照片 1.6px（数据即造型：一眼看出哪年拍得多）
      var thickness = Math.round(16 + photos.length * 1.6);
      var cover = photos[0].src;                  // 封面图 = 当年数组第一张

      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.style.setProperty('--t', thickness);

      slot.innerHTML =
        '<div class="spine-label">' + year + '</div>' +
        '<div class="cover-view">' +
          '<img src="' + cover + '" alt="' + year + ' 封面" />' +
          '<div class="year">' + year + '</div>' +
          '<div class="count">' + photos.length + ' PHOTOS</div>' +
        '</div>';

      // 点击 = 翻开这本书
      slot.addEventListener('click', function () { openBook(year, slot); });

      shelf.appendChild(slot);
    });

    // ══ 第二部分：阅读视图（翻开书之后） ══

    var reader      = document.getElementById('reader');
    var readerTitle = document.getElementById('readerTitle');
    var pageMain    = document.getElementById('pageMain');
    var pageImg     = document.getElementById('pageImg');
    var pageNote    = document.getElementById('pageNote');
    var pageFolio   = document.getElementById('pageFolio');

    var currentYear   = null;   // 当前翻开的是哪一年
    var currentIndex  = 0;      // 当前看到第几张
    var activeSlot    = null;   // 书架上被翻开的那本（合上时还原）
    var turning       = false;  // 翻页动画进行中，防连点错乱

    // 翻开：书脊展宽露出封面，其余书淡出，然后淡入阅读视图
    function openBook(year, slot) {
      currentYear  = year;
      currentIndex = 0;
      activeSlot   = slot;
      shelf.classList.add('opening');
      slot.classList.add('active');
      setTimeout(function () {
        renderPage();
        reader.classList.add('open');
      }, 380);
    }

    // 合上：阅读视图淡出，书架还原
    function closeBook() {
      reader.classList.remove('open');
      shelf.classList.remove('opening');
      if (activeSlot) activeSlot.classList.remove('active');
      activeSlot = null;
      currentYear = null;
    }

    // ✏️═══════════════ 页脚文字怎么自定义（给作者看） ═══════════════
    // 每张照片下面可以写一行自己的话（note 字段），显示在照片和页码之间。
    // 修改位置：data.js → allArchive → 对应年份的数组里，给那张照片加一行 note。
    // 写法示例（每个字段独占一行，方便手动编辑）：
    //
    //   '2023': [
    //     {
    //       src: 'assets/images/archive/2023/1.jpeg',
    //       alt: '',
    //       note: '多佛白崖下的海湾',        // ← 加这一行，就显示这句话
    //     },
    //     {
    //       src: 'assets/images/archive/2023/2.jpeg',
    //       alt: '',
    //     },                                  // ← 不写 note 就只显示页码，不占位
    //   ],
    //
    // 改完刷新页面即可（浏览器缓存 data.js 时用 Cmd+Shift+R 硬刷新）。
    // ═══════════════════════════════════════════════════════════════

    // 渲染当前页：照片 + 自定义文字（note）+ 页码
    function renderPage() {
      var photos = allArchive[currentYear];
      var photo  = photos[currentIndex];
      pageImg.src = photo.src;
      pageImg.alt = photo.alt || (currentYear + ' 散片');
      pageNote.textContent = photo.note || '';   // 没写 note 就是空，CSS 会把整行隐藏
      // 页码不带年份：左上角已标注这本书是哪年，这里只报"第几页 / 共几页"
      pageFolio.textContent = (currentIndex + 1) + ' / ' + photos.length;
      readerTitle.textContent = currentYear;
    }

    // 翻页：dir = +1 往后 / -1 往回。旧页滑出渐隐 → 换内容 → 新页滑入
    function turnPage(dir) {
      if (turning || !currentYear) return;
      var photos = allArchive[currentYear];
      var target = currentIndex + dir;
      if (target < 0 || target >= photos.length) return;   // 到头停住（不循环）

      turning = true;
      pageMain.classList.add(dir > 0 ? 'turn-next' : 'turn-prev');
      setTimeout(function () {
        currentIndex = target;
        renderPage();
        pageMain.classList.remove('turn-next', 'turn-prev');
        turning = false;
      }, 280);
    }

    // 主页面左半边点击 = 往回翻，右半边 = 往后翻（正式版会接 fluid.js 手势）
    pageMain.addEventListener('click', function (e) {
      var mid = pageMain.getBoundingClientRect().width / 2;
      turnPage(e.clientX < mid ? -1 : 1);
    });

    document.getElementById('readerExit').addEventListener('click', closeBook);

    // 键盘：← → 翻页，Esc 合上书
    document.addEventListener('keydown', function (e) {
      if (!reader.classList.contains('open')) return;
      if (e.key === 'ArrowRight') turnPage(1);
      if (e.key === 'ArrowLeft')  turnPage(-1);
      if (e.key === 'Escape')     closeBook();
    });
  </script>
</body>
</html>
