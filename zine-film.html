<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kodak Portra 400 — 画册实验 · Film 垂直胶片条</title>

  <!-- ═══════════════════════════════════════════════════════════
       ⚠️ 实验样张 · Film 垂直胶片条（zine-scroll-experiment 分支专用）

       Film 板块的画册化实验。核心隐喻：**往下滚动 = 从暗盒里抽出整卷底片**。
       一卷胶片本来就是一条竖着的长带子——滚动方向和胶片方向天然重合。

       与 film.html 阅读视图的关系：
       · 阅读视图 = 一次看一格（灯箱看片）；这页 = 整卷摊开（看接触印样 contact sheet）
       · 片框语言沿用：135 齿孔、片基黑边、片边字
       · 片边字用 font-shell（物体表面印字的全站例外），柯达边印的
         琥珀色是"品牌色即内容"的既有例外（同 SHELL_STYLES 的原则）
       ═══════════════════════════════════════════════════════════ -->

  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Tailwind 运行时（本地副本）：与全站一致，别改回在线 CDN -->
  <script src="assets/vendor/tailwind.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'site-bg':      '#fafaf7',
            'site-surface': '#f2f2ef',
            'site-border':  '#e0e0dc',
            'site-text':    '#111111',
            'site-muted':   '#8a8a85',
            'site-accent':  '#111111',
          },
          fontFamily: {
            'display': ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'body':    ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'zh':      ['"Noto Serif SC"', '"Source Han Serif SC"', 'serif'],
            /* 物体表面印字专用（与 film.html 同一条例外规则） */
            'shell':   ['"Helvetica Neue"', 'Arial', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <!-- 字体（本地副本）：与全站一致 -->
  <link href="assets/vendor/fonts.css" rel="stylesheet" />

  <style>
    /* ── 胶片条本体：这些是"物"的造型，不是界面样式，所以用手写 CSS ──
       颜色说明：片基 = site-text（与阅读视图片框一致）；
       齿孔 = 冲掉的洞，透出纸面 site-bg；
       边印琥珀色 #d9a441 = 柯达边印的品牌色（内容例外，别收进设计系统） */
    .strip       { background: #111111; }
    .perf-col    { display: flex; flex-direction: column; justify-content: space-around; align-items: center; }
    .perf-col .hole { width: 6px; height: 9px; border-radius: 1.5px; background: #fafaf7; }
    .edge-print  { color: #d9a441; }
    /* 片头舌：新胶卷抽出来的那条窄舌，末端带弧度（同 film.html 的 .tip） */
    .leader-tongue { width: 54%; height: 110px; background: #111111; border-radius: 14px 14px 0 0; }
    .leader-slope  { height: 70px; background: #111111; clip-path: polygon(0 100%, 0 0, 54% 0, 100% 100%); }
    /* 片尾：斜口剪断 */
    .strip-tail  { height: 90px; background: #111111; clip-path: polygon(0 0, 100% 0, 100% 30%, 0 100%); }
  </style>
</head>

<body class="bg-site-bg text-site-text font-body antialiased">

  <!-- 导航栏：与全站统一 -->
  <nav class="fixed top-0 w-full z-50 bg-site-bg">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-display text-xl tracking-wide text-site-text hover:text-site-muted transition-colors">
        Yang
      </a>
      <ul class="flex gap-8 text-sm text-site-muted">
        <li><a href="gallery.html" class="hover:text-site-text transition-colors">Gallery</a></li>
        <li><a href="archive.html" class="hover:text-site-text transition-colors">Archive</a></li>
        <li><a href="film.html"    class="text-site-text">Film</a></li>
        <li><a href="about.html"   class="hover:text-site-text transition-colors">About</a></li>
      </ul>
    </div>
  </nav>

  <div class="h-16"></div>


  <!-- ── 封面区：编辑式开篇。型号是这卷在柜子里的名字，可以当封面标题；
       但参数行仍然把固定技术信息成组放（与 film.html 阅读视图同一原则） ── -->
  <header class="max-w-3xl mx-auto px-6 pt-20 md:pt-28">
    <div class="flex items-center gap-3">
      <span class="inline-block w-2 h-[1.5px] bg-site-text"></span>
      <span class="font-display text-xs tracking-[0.22em] uppercase text-site-muted">Film · 135 · 36 Exposures</span>
    </div>
    <h1 class="mt-8">
      <span class="block font-display text-4xl md:text-5xl leading-tight">Kodak Portra 400</span>
    </h1>
    <p class="font-display text-sm text-site-muted mt-5 tracking-wide">Canon EOS-1 · 2025.12</p>
    <div class="mt-10 h-px bg-site-border"></div>
  </header>


  <!-- ── 整卷底片：片头舌 → 36 格 → 斜口剪断（由下方脚本从 allFilms 渲染） ── -->
  <main class="mt-20 md:mt-28">
    <div id="film-strip" class="mx-auto w-[92vw] max-w-[520px]">
      <!-- 片头舌 + 斜坡过渡：滚动开始 = 抽片开始 -->
      <div class="leader-tongue"></div>
      <div class="leader-slope"></div>
      <!-- 36 格由脚本插入这里 -->
      <div id="frames" class="strip"></div>
      <!-- 片尾斜口 -->
      <div class="strip-tail"></div>
    </div>
  </main>


  <!-- ── 版权页 ── -->
  <footer class="max-w-3xl mx-auto px-6 pt-24 md:pt-32 pb-28 md:pb-36">
    <div class="h-px bg-site-border mb-10"></div>
    <p class="font-zh text-sm text-site-muted">三十六格 · 二〇二五年十二月</p>
    <p class="font-display text-sm text-site-muted mt-1">Kodak Portra 400 · Canon EOS-1</p>
    <p class="font-display text-2xl mt-8">Yang</p>
    <a href="film.html" class="inline-block font-display text-sm text-site-muted hover:text-site-text transition-colors mt-10">&rarr; Back to Film</a>
  </footer>


  <script src="data.js"></script>
  <script src="zine-dims.js"></script>
  <script>
    // 从 allFilms 里找到这卷（Portra 400，2025.12）
    var roll = allFilms.filter(function (f) { return f.id === '2512-portra400-135'; })[0];
    var framesEl = document.getElementById('frames');

    // 逐格渲染：135 片框 = [齿孔列] [照片] [齿孔列]，格与格之间是边印带
    roll.photos.forEach(function (photo, i) {

      // ── 片框：左右齿孔 + 中间照片 ──
      var frame = document.createElement('div');
      frame.className = 'grid grid-cols-[26px_1fr_26px] py-1';

      // 齿孔列（每格 9 颗，间距由 space-around 自动适配照片高度）
      ['left', 'right'].forEach(function () {
        var col = document.createElement('div');
        col.className = 'perf-col';
        for (var h = 0; h < 9; h++) {
          var hole = document.createElement('div');
          hole.className = 'hole';
          col.appendChild(hole);
        }
        // 先都建好，照片列在中间，所以第二列 append 在照片之后（见下）
        frame.appendChild(col);
      });

      // 照片：插到两条齿孔列之间
      var img = document.createElement('img');
      // 条宽最多 520px，小图档绰绰有余，不需要 srcset 原图档
      img.src = photo.src.replace('assets/images/', 'assets/images-sm/');
      img.alt = photo.alt || '';
      img.className = 'w-full h-auto block';
      if (i > 0) img.loading = 'lazy';
      var dim = ZINE_DIMS[photo.src];
      if (dim) { img.width = dim[0]; img.height = dim[1]; }
      frame.insertBefore(img, frame.children[1]);

      framesEl.appendChild(frame);

      // ── 边印带：左 = 型号边印，右 = 画格编号（135 写法带 A，同阅读视图） ──
      var band = document.createElement('div');
      band.className = 'flex items-center justify-between px-8 h-10';
      var brand = document.createElement('span');
      brand.className = 'font-shell edge-print text-[10px] tracking-[0.25em]';
      brand.textContent = 'KODAK PORTRA 400';
      var num = document.createElement('span');
      num.className = 'font-shell edge-print text-[11px] tracking-widest';
      num.textContent = (i + 1) + 'A';
      band.appendChild(brand);
      band.appendChild(num);
      framesEl.appendChild(band);
    });
  </script>

</body>
</html>
