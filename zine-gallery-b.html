<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>再见，UCL — 画册实验 B · 纯净式</title>

  <!-- ═══════════════════════════════════════════════════════════
       ⚠️ 实验样张 B · 纯净式（zine-scroll-experiment 分支专用）

       与 A（编辑式）同一个系列、同一批照片，用来对照回答一个问题：
       Kami 的编辑排版骨架（眉题、间页、大小错落、出血图）到底值不值得要？

       B 的哲学 = 把现有网站的沉默感原样搬进滚动：
       · 没有眉题、没有间页、没有出血图、没有双联页
       · 每张照片同一列宽、整张装进一屏（max-height 85vh）——
         像阅读视图"一页一张"的秩序，只是翻页换成了滚动
       · 开篇用本站现有的页头习语（左对齐短分割线），不用 Kami 的发丝线收束
       ═══════════════════════════════════════════════════════════ -->

  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Tailwind 运行时（本地副本）：与全站一致，别改回在线 CDN -->
  <script src="assets/vendor/tailwind.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'site-bg':      '#fafaf7',
            'site-surface': '#f2f2ef',
            'site-border':  '#e0e0dc',
            'site-text':    '#111111',
            'site-muted':   '#8a8a85',
            'site-accent':  '#111111',
          },
          fontFamily: {
            'display': ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'body':    ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'zh':      ['"Noto Serif SC"', '"Source Han Serif SC"', 'serif'],
          },
        }
      }
    }
  </script>

  <!-- 字体（本地副本）：与全站一致 -->
  <link href="assets/vendor/fonts.css" rel="stylesheet" />
</head>

<body class="bg-site-bg text-site-text font-body antialiased">

  <!-- 导航栏：与全站统一 -->
  <nav class="fixed top-0 w-full z-50 bg-site-bg">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-display text-xl tracking-wide text-site-text hover:text-site-muted transition-colors">
        Yang
      </a>
      <ul class="flex gap-8 text-sm text-site-muted">
        <li><a href="gallery.html" class="text-site-text">Gallery</a></li>
        <li><a href="archive.html" class="hover:text-site-text transition-colors">Archive</a></li>
        <li><a href="film.html"    class="hover:text-site-text transition-colors">Film</a></li>
        <li><a href="about.html"   class="hover:text-site-text transition-colors">About</a></li>
      </ul>
    </div>
  </nav>

  <div class="h-16"></div>


  <!-- ── 封面区：本站现有页头习语（标题 → 元信息 → 左对齐短分割线 → 导语），无眉题 ── -->
  <header class="max-w-3xl mx-auto px-6 pt-20 md:pt-28">
    <h1>
      <span class="block font-zh text-4xl md:text-5xl leading-tight">再见，UCL</span>
      <span class="block font-display text-xl md:text-2xl mt-3 text-site-muted">Goodbye, UCL</span>
    </h1>
    <p class="font-display text-sm text-site-muted mt-5 tracking-wide">2026 · University College London</p>

    <!-- 短分割线：与 gallery / archive 页头同构 -->
    <div class="mt-8 h-px w-20 bg-site-border"></div>

    <p class="font-zh text-base md:text-lg leading-[2] mt-10 max-w-[36em]">
      这组照片全部拍摄于 2026 年 6 月 12 日，这是我学生证过期的最后一天。我特意来了一趟，把这三年我走过的角角落落重温一遍，尽管 UCL 我已经熟悉到没什么可拍的了，可是还是拍了许多张主楼的照片。
    </p>
  </header>


  <!-- ── 照片流：一列到底，每张整幅装进一屏（max-h-85vh），秩序即风格 ──
       由下方脚本从 data.js 渲染：16 张写死太啰嗦，B 版排版规则是均一的，交给循环 -->
  <main id="photo-flow" class="mt-24 md:mt-36"></main>


  <!-- ── 版权页：极简收尾 ── -->
  <footer class="max-w-3xl mx-auto px-6 pb-28 md:pb-36">
    <div class="h-px w-20 bg-site-border mb-10"></div>
    <p class="font-zh text-sm text-site-muted">十六张照片 · 二〇二六年六月十二日</p>
    <p class="font-display text-2xl mt-8">Yang</p>
    <a href="gallery.html" class="inline-block font-display text-sm text-site-muted hover:text-site-text transition-colors mt-10">&rarr; Back to Gallery</a>
  </footer>


  <script src="data.js"></script>
  <script src="zine-dims.js"></script>
  <script>
    // 把 goodbye-ucl 的照片按"一列到底"的均一规则渲染出来。
    // 小图档路径规则与 fluid.js 的 fluidSmallSrc 相同（本页不加载 fluid.js，就地两行）
    function smallSrc(src) { return src.replace('assets/images/', 'assets/images-sm/'); }

    var flow = document.getElementById('photo-flow');
    allPhotos['goodbye-ucl'].forEach(function (photo, i) {
      var fig = document.createElement('figure');
      fig.className = 'max-w-3xl mx-auto px-6 mb-28 md:mb-44';

      var img = document.createElement('img');
      img.src = smallSrc(photo.src);
      img.srcset = smallSrc(photo.src) + ' 1280w, ' + photo.src + ' 2560w';
      img.sizes = '(min-width: 768px) 720px, 100vw';
      img.alt = photo.alt || '';
      if (i > 0) img.loading = 'lazy';
      // 宽高占位：从尺寸表读，加载前后尺寸一致、页面不跳版。
      // ⚠️ 不能用 w-auto 等图片自己撑（懒加载的图在加载前是 0×0）——
      // 横片直接吃满列宽；竖片按已知比例给一个确定宽度（整张不超过 85vh 高）
      var dim = ZINE_DIMS[photo.src];
      if (dim) {
        img.width = dim[0];
        img.height = dim[1];
        var ratio = dim[0] / dim[1];
        if (ratio < 1) {
          img.className = 'block mx-auto h-auto max-w-full';
          img.style.width = 'min(100%, calc(85vh * ' + ratio.toFixed(4) + '))';
        } else {
          img.className = 'block mx-auto w-full h-auto';
        }
      } else {
        img.className = 'block mx-auto w-auto h-auto max-w-full max-h-[85vh]';
      }
      fig.appendChild(img);

      // 图注：有才显示；中文走中文衬线、英文走 Cormorant
      if (photo.caption || photo.desc) {
        var cap = document.createElement('figcaption');
        cap.className = 'mt-4 text-center';
        if (photo.caption) {
          var line1 = document.createElement('span');
          line1.className = (/[一-鿿]/.test(photo.caption) ? 'font-zh' : 'font-display') + ' text-sm block';
          line1.textContent = photo.caption;
          cap.appendChild(line1);
        }
        if (photo.desc) {
          var line2 = document.createElement('span');
          line2.className = 'font-zh text-sm text-site-muted block mt-1';
          line2.textContent = photo.desc;
          cap.appendChild(line2);
        }
        fig.appendChild(cap);
      }
      flow.appendChild(fig);
    });
  </script>

</body>
</html>
