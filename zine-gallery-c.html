<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>照片记忆｜2025 — 画册实验 C · 分章式</title>

  <!-- ═══════════════════════════════════════════════════════════
       ⚠️ 实验样张 C · 分章式（zine-scroll-experiment 分支专用）

       用最重的系列（photos-of-2025，四章 52 张）回答第三个问题：
       分章系列的"章节卡"在画册里长什么样？

       答案 = 章节扉页（借 Kami 的 Part Divider 思路）：
       · 大号章节数字（01–04）+ 中文章题 + 英文章题 + 发丝线
       · 章与章之间拉开超大留白——滚动里的"翻到新一章"
       · 章内照片一列到底（与 B 同规则），52 张全部懒加载
       ═══════════════════════════════════════════════════════════ -->

  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Tailwind 运行时（本地副本）：与全站一致，别改回在线 CDN -->
  <script src="assets/vendor/tailwind.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'site-bg':      '#fafaf7',
            'site-surface': '#f2f2ef',
            'site-border':  '#e0e0dc',
            'site-text':    '#111111',
            'site-muted':   '#8a8a85',
            'site-accent':  '#111111',
          },
          fontFamily: {
            'display': ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'body':    ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'zh':      ['"Noto Serif SC"', '"Source Han Serif SC"', 'serif'],
          },
        }
      }
    }
  </script>

  <!-- 字体（本地副本）：与全站一致 -->
  <link href="assets/vendor/fonts.css" rel="stylesheet" />
</head>

<body class="bg-site-bg text-site-text font-body antialiased">

  <!-- 导航栏：与全站统一 -->
  <nav class="fixed top-0 w-full z-50 bg-site-bg">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-display text-xl tracking-wide text-site-text hover:text-site-muted transition-colors">
        Yang
      </a>
      <ul class="flex gap-8 text-sm text-site-muted">
        <li><a href="gallery.html" class="text-site-text">Gallery</a></li>
        <li><a href="archive.html" class="hover:text-site-text transition-colors">Archive</a></li>
        <li><a href="film.html"    class="hover:text-site-text transition-colors">Film</a></li>
        <li><a href="about.html"   class="hover:text-site-text transition-colors">About</a></li>
      </ul>
    </div>
  </nav>

  <div class="h-16"></div>


  <!-- ── 封面区：编辑式开篇（与 A 同构），元信息报出章数 ── -->
  <header class="max-w-3xl mx-auto px-6 pt-20 md:pt-28">
    <div class="flex items-center gap-3">
      <span class="inline-block w-2 h-[1.5px] bg-site-text"></span>
      <span class="font-display text-xs tracking-[0.22em] uppercase text-site-muted">Series 06 · In Four Chapters</span>
    </div>
    <h1 class="mt-8">
      <span class="block font-zh text-4xl md:text-5xl leading-tight">照片记忆｜2025</span>
      <span class="block font-display text-2xl md:text-3xl mt-3 text-site-text">Photos of 2025</span>
    </h1>
    <p id="series-meta" class="font-display text-sm text-site-muted mt-5 tracking-wide"></p>
    <div class="mt-10 h-px bg-site-border"></div>
    <!-- 系列导语：descZh 有才显示（由脚本填充） -->
    <p id="series-lead" class="font-zh text-base md:text-lg leading-[2] mt-10 max-w-[36em]"></p>
  </header>


  <!-- ── 章节流：每章 = 扉页 + 照片列（由下方脚本从 allChapters 渲染） ── -->
  <main id="chapter-flow"></main>


  <!-- ── 版权页 ── -->
  <footer class="max-w-3xl mx-auto px-6 pb-28 md:pb-36">
    <div class="h-px bg-site-border mb-10"></div>
    <p class="font-zh text-sm text-site-muted">五十二张照片 · 四个章节</p>
    <p class="font-display text-sm text-site-muted mt-1">Photos of 2025</p>
    <p class="font-display text-2xl mt-8">Yang</p>
    <a href="gallery.html" class="inline-block font-display text-sm text-site-muted hover:text-site-text transition-colors mt-10">&rarr; Back to Gallery</a>
  </footer>


  <script src="data.js"></script>
  <script src="zine-dims.js"></script>
  <script>
    // 小图档路径规则（与 fluid.js 的 fluidSmallSrc 相同，本页就地一行）
    function smallSrc(src) { return src.replace('assets/images/', 'assets/images-sm/'); }

    // 封面元信息 + 导语：从 allSeries 读，空字段不显示
    var series = allSeries.filter(function (s) { return s.id === 'photos-of-2025'; })[0];
    document.getElementById('series-meta').textContent =
      series.year + (series.location ? ' · ' + series.location : '');
    var lead = document.getElementById('series-lead');
    if (series.descZh) { lead.textContent = series.descZh; } else { lead.remove(); }

    // 逐章渲染：扉页 + 照片列
    var flow = document.getElementById('chapter-flow');
    allChapters['photos-of-2025'].forEach(function (chapter, ci) {

      // ── 章节扉页：大数字 + 中英章题 + 发丝线（画册里的 Part Divider） ──
      var opener = document.createElement('section');
      opener.className = 'max-w-3xl mx-auto px-6 pt-28 md:pt-44 pb-16 md:pb-24';
      var num = String(ci + 1);
      if (num.length < 2) num = '0' + num;

      var numEl = document.createElement('p');
      numEl.className = 'font-display text-6xl md:text-7xl text-site-muted';
      numEl.textContent = num;
      opener.appendChild(numEl);

      var zhTitle = document.createElement('h2');
      zhTitle.className = 'font-zh text-2xl md:text-3xl mt-6';
      zhTitle.textContent = chapter.titleZh;
      opener.appendChild(zhTitle);

      var enTitle = document.createElement('p');
      enTitle.className = 'font-display text-lg md:text-xl text-site-muted mt-2';
      enTitle.textContent = chapter.titleEn;
      opener.appendChild(enTitle);

      // 章节简介：有才显示
      if (chapter.descZh) {
        var desc = document.createElement('p');
        desc.className = 'font-zh text-base leading-[2] mt-6 max-w-[34em]';
        desc.textContent = chapter.descZh;
        opener.appendChild(desc);
      }

      var rule = document.createElement('div');
      rule.className = 'mt-10 h-px w-20 bg-site-border';
      opener.appendChild(rule);
      flow.appendChild(opener);

      // ── 章内照片：一列到底（与 B 版同规则），全部懒加载 ──
      chapter.photos.forEach(function (photo, pi) {
        var fig = document.createElement('figure');
        fig.className = 'max-w-2xl mx-auto px-6 mb-24 md:mb-36';

        var img = document.createElement('img');
        img.src = smallSrc(photo.src);
        img.srcset = smallSrc(photo.src) + ' 1280w, ' + photo.src + ' 2560w';
        img.sizes = '(min-width: 672px) 624px, 100vw';
        img.alt = photo.alt || '';
        if (ci > 0 || pi > 0) img.loading = 'lazy';
        // 宽高占位（同 B 版的写法）：横片吃满列宽，竖片按比例给确定宽度，
        // 懒加载前后尺寸一致、滚动不跳版
        var dim = ZINE_DIMS[photo.src];
        if (dim) {
          img.width = dim[0];
          img.height = dim[1];
          var ratio = dim[0] / dim[1];
          if (ratio < 1) {
            img.className = 'block mx-auto h-auto max-w-full';
            img.style.width = 'min(100%, calc(80vh * ' + ratio.toFixed(4) + '))';
          } else {
            img.className = 'block mx-auto w-full h-auto';
          }
        } else {
          img.className = 'block mx-auto w-auto h-auto max-w-full max-h-[80vh]';
        }
        fig.appendChild(img);

        // 图注：分章系列照片格式与普通系列相同，有 caption/desc 才显示
        if (photo.caption || photo.desc) {
          var cap = document.createElement('figcaption');
          cap.className = 'mt-4 text-center';
          if (photo.caption) {
            var line1 = document.createElement('span');
            line1.className = (/[一-鿿]/.test(photo.caption) ? 'font-zh' : 'font-display') + ' text-sm block';
            line1.textContent = photo.caption;
            cap.appendChild(line1);
          }
          if (photo.desc) {
            var line2 = document.createElement('span');
            line2.className = 'font-zh text-sm text-site-muted block mt-1';
            line2.textContent = photo.desc;
            cap.appendChild(line2);
          }
          fig.appendChild(cap);
        }
        flow.appendChild(fig);
      });
    });
  </script>

</body>
</html>
