<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>再见，UCL — 画册实验 D · 满屏一张式</title>

  <!-- ═══════════════════════════════════════════════════════════
       ⚠️ 实验样张 D · 满屏一张式（zine-scroll-experiment 分支专用）

       作者的诉求：任何设备上，用户眼前永远只有一张照片。

       实现 = 两个浏览器原生能力，零 JS 翻页逻辑：
       · 每张照片一个整屏"页"（100dvh：手机地址栏收起/展开时自动跟随）
       · 滚动吸附（scroll-snap）：往下滑自动停到下一页的整屏位置，
         scroll-snap-stop: always 保证一次滑动只翻一页——不会甩过头
       · 照片居中收纳公式与首页明信片相同：max-width / max-height 双约束，
         不裁切不拉伸，横竖片在任何屏幕上都自己找到合适的大小，余量全是留白
       · 页脚定高（图注 + 页码 n/N），照片横竖变化时页码位置不跳——
         与 archive 阅读视图"定高页脚贴底"同一条经验
       ═══════════════════════════════════════════════════════════ -->

  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Tailwind 运行时（本地副本）：与全站一致，别改回在线 CDN -->
  <script src="assets/vendor/tailwind.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'site-bg':      '#fafaf7',
            'site-surface': '#f2f2ef',
            'site-border':  '#e0e0dc',
            'site-text':    '#111111',
            'site-muted':   '#8a8a85',
            'site-accent':  '#111111',
          },
          fontFamily: {
            'display': ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'body':    ['"Cormorant Garamond"', 'Georgia', 'serif'],
            'zh':      ['"Noto Serif SC"', '"Source Han Serif SC"', 'serif'],
          },
        }
      }
    }
  </script>

  <!-- 字体（本地副本）：与全站一致 -->
  <link href="assets/vendor/fonts.css" rel="stylesheet" />

  <style>
    /* ── 满屏分页 + 滚动吸附（本页的全部机关都在这几行）──
       100dvh 是"动态视口高度"：手机浏览器地址栏收起/展开时它跟着变，
       照片永远正好占满可见区域；老浏览器不认识 dvh 就回退用 100vh */
    html { scroll-snap-type: y mandatory; }
    .page {
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;   /* 一次滑动只翻一页，大力甩也不跳页 */
    }
    /* iPhone 底部小黑条的安全区：页脚別被它压住 */
    .page-foot { padding-bottom: max(0px, env(safe-area-inset-bottom)); }
  </style>
</head>

<body class="bg-site-bg text-site-text font-body antialiased">

  <!-- 导航栏：与全站统一（浮在第一屏上方） -->
  <nav class="fixed top-0 w-full z-50 bg-site-bg">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="font-display text-xl tracking-wide text-site-text hover:text-site-muted transition-colors">
        Yang
      </a>
      <ul class="flex gap-8 text-sm text-site-muted">
        <li><a href="gallery.html" class="text-site-text">Gallery</a></li>
        <li><a href="archive.html" class="hover:text-site-text transition-colors">Archive</a></li>
        <li><a href="film.html"    class="hover:text-site-text transition-colors">Film</a></li>
        <li><a href="about.html"   class="hover:text-site-text transition-colors">About</a></li>
      </ul>
    </div>
  </nav>


  <!-- ── 第一屏：封面页（也是一个吸附页）── -->
  <section class="page flex flex-col items-center justify-center px-6 text-center">
    <h1>
      <span class="block font-zh text-4xl md:text-5xl leading-tight">再见，UCL</span>
      <span class="block font-display text-xl md:text-2xl mt-4 text-site-muted">Goodbye, UCL</span>
    </h1>
    <p class="font-display text-sm text-site-muted mt-6 tracking-wide">2026 · University College London</p>
    <div class="mt-10 h-px w-20 bg-site-border"></div>
    <p class="font-zh text-sm md:text-base leading-[2] mt-10 max-w-[30em] text-site-muted">
      这组照片全部拍摄于 2026 年 6 月 12 日，这是我学生证过期的最后一天。我特意来了一趟，把这三年我走过的角角落落重温一遍。
    </p>
  </section>


  <!-- ── 照片页：一屏一张，由下方脚本从 data.js 渲染 ── -->
  <main id="pages"></main>


  <!-- ── 最后一屏：版权页（也是吸附页）── -->
  <section class="page flex flex-col items-center justify-center px-6 text-center">
    <div class="h-px w-20 bg-site-border mb-10"></div>
    <p class="font-zh text-sm text-site-muted">十六张照片 · 二〇二六年六月十二日</p>
    <p class="font-display text-sm text-site-muted mt-1">16 photographs · one last afternoon at UCL</p>
    <p class="font-display text-2xl mt-8">Yang</p>
    <a href="gallery.html" class="inline-block font-display text-sm text-site-muted hover:text-site-text transition-colors mt-10">&rarr; Back to Gallery</a>
  </section>


  <script src="data.js"></script>
  <script src="zine-dims.js"></script>
  <script>
    // 小图档路径规则（与 fluid.js 的 fluidSmallSrc 相同，本页就地一行）
    function smallSrc(src) { return src.replace('assets/images/', 'assets/images-sm/'); }

    var photos = allPhotos['goodbye-ucl'];
    var total = photos.length;
    var pages = document.getElementById('pages');

    photos.forEach(function (photo, i) {
      // 每张照片 = 一个整屏吸附页：上面弹性区居中放照片，底部定高页脚
      var sec = document.createElement('section');
      sec.className = 'page flex flex-col px-6 pt-16 pb-5';

      // 照片区：弹性占满剩余高度，照片在其中居中收纳（不裁切不拉伸）
      var stage = document.createElement('div');
      stage.className = 'flex-1 min-h-0 flex items-center justify-center';

      var img = document.createElement('img');
      img.src = smallSrc(photo.src);
      img.srcset = smallSrc(photo.src) + ' 1280w, ' + photo.src + ' 2560w';
      // 显示尺寸不超过 92vw：让浏览器按屏幕自己挑小图/大图
      img.sizes = '92vw';
      img.alt = photo.alt || '';
      // 双重约束 = 首页明信片的收纳公式：横竖片都自己找到合适大小
      img.className = 'max-w-[92vw] max-h-full w-auto h-auto';
      if (i > 0) img.loading = 'lazy';
      var dim = ZINE_DIMS[photo.src];
      if (dim) { img.width = dim[0]; img.height = dim[1]; }
      stage.appendChild(img);
      sec.appendChild(stage);

      // 定高页脚：左 = 图注（有才显示），右 = 页码 n / N。
      // 高度固定，照片横竖变化时页码不跳位置
      var foot = document.createElement('div');
      foot.className = 'page-foot h-12 shrink-0 flex items-baseline justify-between gap-6 max-w-4xl mx-auto w-full pt-3';
      var cap = document.createElement('span');
      cap.className = (/[一-鿿]/.test(photo.caption || '') ? 'font-zh' : 'font-display') + ' text-sm text-site-muted truncate';
      cap.textContent = photo.caption || '';
      var num = document.createElement('span');
      num.className = 'font-display text-xs text-site-muted tracking-widest shrink-0';
      num.textContent = (i + 1) + ' / ' + total;
      foot.appendChild(cap);
      foot.appendChild(num);
      sec.appendChild(foot);

      pages.appendChild(sec);
    });
  </script>

</body>
</html>
