  <!-- ═══════════════════════════════════════════════════════════
       ⭐ 画册式阅读 —— 全站三个板块共用的阅读页（2026-07-30 转正）

       三种入口，同一套排版语言、同一个文件：
       · zine.html?id=系列ID    → Gallery 一个系列（gallery.html 卡片点进来）
       · zine.html?year=YYYY    → Archive 一年的散片（archive.html 点开一本书）
       · zine.html?film=卷ID    → Film 一卷（film.html 点开一个筒；照片嵌在片框里）
       每一本都有自己的网址——这也是"每卷/每年可以单独分享"的前提。
       旧的阅读方式（series.html 的 Lightbox、archive/film 页内的阅读视图）
       保留作回退，已无入口链接。

       作者评审后拍板的组合（2026-07-30）：
       · 底座 = 满屏一张式：每页 100dvh + 滚动吸附，任何设备眼前只有一张照片
       · 图文模块：左右面板（对开交替）/ 页边批注 / 图下注 / 纯照片页 / 独立文字页
       · 翻到哪页，照片轻轻浮上来（450ms 无回弹，抄 fluidReveal 的手感；
         系统开了"减弱动态"则只淡入不上浮；首张照片不做入场式）

       每页用哪种图文模式，由 data.js 决定，两层规则：
       ① 显式指定：照片条目写 layout 字段 —— 'panel-right' 图左文右 /
          'panel-left' 图右文左 / 'margin' 页边批注 / 'caption' 图下注 / 'plain' 纯照片
       ② 不写 layout 走自动规则（按已有字段的语义，不需要作者额外劳动）：
          有 desc 长描述 → 左右面板逐张交替（书籍对开的节奏）
          有 note 一句话 → 页边批注
          只有 caption   → 图下注
          什么都没有     → 纯照片页
       独立文字页：photos 数组里插一条 { text: '……' }，写在哪就出现在哪
       空白页：插一条 { blank: true }（画册里的喘息页，一整屏纯纸面）
       分章系列：每章自动插一页章节扉页（大数字 + 中英章题）
       组图 { group: [...] }：同屏并排，共用一组文字

       面板方向的全局开关：下方脚本顶部的 PANEL_SIDE 常量（作者可自己改）——
       'right' 固定在右（当前默认）/ 'left' 固定在左 / 'alternate' 左右交替。
       个别照片想反着放，用 layout: 'panel-left' 逐张覆盖，构图说了算
       ═══════════════════════════════════════════════════════════ -->

  <!-- 字体（本地副本）：与全站一致 -->
  <link href="assets/vendor/fonts.css" rel="stylesheet" />

  <style>
    /* ── 整屏分页 + 滚动吸附 ──
       100dvh：手机地址栏收起/展开时页高自动跟随；老浏览器回退 100vh */
    html { scroll-snap-type: y mandatory; }
    .page {
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;   /* 一次滑动只翻一页 */
    }
    .page-foot { padding-bottom: max(0px, env(safe-area-inset-bottom)); }

    /* ── 翻页浮现：照片（和文字块）第一次进入视野时轻轻浮上来 ──
       只动 opacity/transform（GPU 合成，不触发排版）；曲线抄 fluidReveal：
       450ms、14px、无回弹。系统"减弱动态"开着就只淡入。 */
    .zr {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .45s ease, transform .45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* 落定感（脚本顶部 SETTLE_SCALE 开关）：上浮之外叠加极轻的 0.985→1，
       像实物放上纸面。不喜欢就把开关改成 false，一个词的事 */
    body.zine-settle .zr { transform: translateY(14px) scale(0.985); }
    .zr.on, body.zine-settle .zr.on { opacity: 1; transform: none; }
    /* 文字比照片晚一拍到场（约 100ms）：先看画、再读签的次序感 */
    .zr-late { transition-delay: .1s; }
    @media (prefers-reduced-motion: reduce) {
      .zr, body.zine-settle .zr { transform: none; transition: opacity .45s ease; }
    }

    /* ── 按压态：反馈发生在按下的瞬间（Apple 的 Response 原则），
       与 gallery 卡片 / archive 书脊的既有约定同一家族。
       注：链接都带 Tailwind 的 transition-colors，它会盖掉元素级的过渡，
       所以用 a.transition-colors 提高优先级，把颜色和形变的过渡合在一起 ── */
    a { display: inline-block; transition: transform .1s ease-out; }
    a.transition-colors {
      transition-property: color, transform;
      transition-duration: .15s, .1s;
      transition-timing-function: ease, ease-out;
    }
    a:active { transform: scale(0.97); }

    /* ══ Film 片框：照片嵌在底片上 ══════════════════════════════
       Film 卷（?film=）专用。照片不是"贴在纸上"而是"嵌在胶片里"——
       135 上下两排齿孔 + 片边字，120 无齿孔、素黑宽边。这是 Film 的身份，
       从 film.html 的阅读视图移植过来（那边是单例 #film-frame，
       画册里一屏一格所以改成类选择器）。竖片时齿孔转到左右两侧、
       片边字横贯顶部——物理底片上竖片是横躺的，完全还原就得歪头看，
       所以这里拟物让位于可用性（与 film.html 同一权衡）。 */
    .film-frame {
      display: grid;
      grid-template-areas: "pa" "edge" "img" "pb";
      padding: 8px 18px 10px;
      max-width: 100%;
    }
    .film-frame .perf-a { grid-area: pa; }
    .film-frame .perf-b { grid-area: pb; }
    /* width:0 + min-width:100%：齿孔带不参与片框宽度计算（预填的几十颗齿孔
       会把格子撑到全屏），只被动跟随照片的宽度，多余齿孔靠 overflow 裁掉 */
    .film-frame .perf {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
      height: 22px;
      width: 0;
      min-width: 100%;
    }
    .film-frame .hole { flex-shrink: 0; width: 11px; height: 8px; border-radius: 2px; }
    /* 片边字：型号在左、画格编号在右（135 编号带 A，是真实底片的写法） */
    .film-frame .edge-band {
      grid-area: edge;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
      padding: 3px 2px 7px;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.55;
    }
    .film-frame img {
      grid-area: img;
      max-width: 100%;
      max-height: calc(100dvh - 15rem);   /* 视口减去导航/页脚/片框自身的装饰 */
      object-fit: contain;
    }
    /* 竖片：片边字横贯顶部，齿孔改站左右两侧 */
    .film-frame.portrait {
      grid-template-areas: "edge edge edge" "pa img pb";
      padding: 8px 8px 18px;
    }
    .film-frame.portrait .perf {
      flex-direction: column;
      width: 22px;
      min-width: 0;
      height: 0;
      min-height: 100%;
    }
    .film-frame.portrait .hole { width: 8px; height: 11px; }
    .film-frame.portrait .edge-band { padding: 3px 14px 7px; }
    .film-frame.portrait img { max-height: calc(100dvh - 13rem); }
    /* 120：没有齿孔，片基边缘更宽更素 */
    .film-frame.f120, .film-frame.f120.portrait {
      grid-template-areas: "edge" "img";
      padding: 8px 26px 24px;
    }
    .film-frame.f120 .perf { display: none; }
    /* 手机：片框边距收窄，照片限高放宽 */
    @media (max-width: 640px) {
      .film-frame { padding: 6px 10px 8px; }
      .film-frame.f120, .film-frame.f120.portrait { padding: 6px 14px 16px; }
      .film-frame img, .film-frame.portrait img { max-height: 62vh; }
    }
  </style>
</head>

  <!-- 所有页面由脚本生成插到这里 -->
  <main id="book"></main>

  <script src="data.js"></script>
  <script src="zine-dims.js"></script>
  <script>
    // ═══ 可调开关（作者自己改这里）═══════════════════════════════
    // 文字面板放哪边（只影响"没写 layout、靠 desc 自动进面板"的照片）：
    //   'right'     = 固定在右（默认：先看图、目光右移读字，展签惯例）
    //   'left'      = 固定在左
    //   'alternate' = 左右交替（对开节奏，一次只见一页时感知较弱，备用）
    // 个别照片想反着放：在 data.js 里写 layout: 'panel-left' 逐张覆盖
    var PANEL_SIDE = 'right';

    // 浮现时的"落定感"（0.985→1 的极轻缩放）：不喜欢改成 false
    var SETTLE_SCALE = true;
    if (SETTLE_SCALE) document.body.classList.add('zine-settle');

    // ═══ 工具函数 ═══════════════════════════════════════════════

    // 小图档路径规则（与 fluid.js 的 fluidSmallSrc 相同，本页就地一行）
    function smallSrc(src) { return src.replace('assets/images/', 'assets/images-sm/'); }

    // 是否含中文（决定用中文衬线还是 Cormorant）
    function isZh(s) { return /[一-鿿]/.test(s || ''); }

    // 中文数字（版权页用；单本画册照片数不会过百）
    function zhNumber(n) {
      var d = ['零','一','二','三','四','五','六','七','八','九'];
      if (n < 10) return d[n];
      var tens = Math.floor(n / 10), ones = n % 10;
      return (tens > 1 ? d[tens] : '') + '十' + (ones ? d[ones] : '');
    }

    // 年份的中文写法（逐字念）：'2025' → '二〇二五'
    function zhYear(y) {
      var d = ['〇','一','二','三','四','五','六','七','八','九'];
      return String(y).split('').map(function (c) { return d[+c] || c; }).join('');
    }

    // 建元素的简写：el('p', 'font-zh text-sm', '文字')
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text) e.textContent = text;
      return e;
    }

    // 造一张照片 img（带小图/原图 srcset 和宽高占位）
    function makeImg(src, alt, sizes, eager) {
      var img = document.createElement('img');
      img.src = smallSrc(src);
      img.srcset = smallSrc(src) + ' 1280w, ' + src + ' 2560w';
      img.sizes = sizes;
      img.alt = alt || '';
      img.className = 'max-w-full max-h-full w-auto h-auto';
      if (!eager) img.loading = 'lazy';
      var dim = ZINE_DIMS[src];
      if (dim) { img.width = dim[0]; img.height = dim[1]; }
      return img;
    }

    // ═══ 三种书：Gallery 系列 / Archive 年册 / Film 一卷 ═════════
    //
    // 每个 spec 只负责把自己板块的数据翻译成统一的"封面 + 条目流 + 版权页"；
    // 下面的排版引擎只认这套统一格式，不关心数据来自哪个板块。
    // 加新板块 = 加一个 spec 函数，排版代码一行不用动。

    var params = new URLSearchParams(location.search);
    var book = document.getElementById('book');
    var spec = resolveBook();

    function resolveBook() {
      if (params.get('year')) return archiveBook(params.get('year'));
      if (params.get('film')) return filmBook(params.get('film'));
      return galleryBook(params.get('id') || '');
    }

    // ── Gallery：一个系列。分章系列每章前面插一页章节扉页 ──
    function galleryBook(id) {
      var series = allSeries.filter(function (s) { return s.id === id; })[0];
      if (!series) return null;
      var entries = [];
      if (series.type === 'sectioned') {
        (allChapters[id] || []).forEach(function (ch, ci) {
          entries.push({ chapter: ch, index: ci });
          ch.photos.forEach(function (p) { entries.push(p); });
        });
      } else {
        entries = (allPhotos[id] || []).slice();
      }
      return {
        kind: 'gallery',
        nav: 'gallery',
        docTitle: series.titleZh,
        entries: entries,
        cover: {
          titleZh: series.titleZh,
          titleEn: series.titleEn,
          meta: (series.year + (series.location ? ' · ' + series.location : '')).trim(),
          lead: series.descZh,
        },
        colophon: function (n) {
          return {
            zh: zhNumber(n) + '张照片',
            en: series.titleEn + (series.year ? ' · ' + series.year.trim() : ''),
          };
        },
        back: { href: 'gallery.html', text: '→ Back to Gallery' },
      };
    }

    // ── Archive：一年的散片。数据里只有 src/alt/note，
    //    note 当图注放页脚——Archive 的定位就是"只放照片"，不上文字面板 ──
    function archiveBook(year) {
      var photos = allArchive[year];
      if (!photos || !photos.length) return null;
      return {
        kind: 'archive',
        nav: 'archive',
        docTitle: year,
        entries: photos.map(function (p) {
          return {
            src:     p.src,
            alt:     p.alt,
            caption: p.note || '',
            layout:  p.note ? 'caption' : 'plain',
          };
        }),
        cover: {
          titleEn: year,      // 年份即书名（与书脊上只印年份同一个基因）
          bigEn:   true,      // 超大号数字当封面
          meta:    '散片档案 · ' + zhNumber(photos.length) + '张',
        },
        colophon: function (n) {
          return { zh: zhNumber(n) + '张散片 · ' + zhYear(year) + '年', en: 'Archive ' + year };
        },
        back: { href: 'archive.html', text: '→ Back to Archive' },
      };
    }

    // ── Film：一卷。照片嵌在片框里（135 齿孔 / 120 素黑边）；
    //    卷级的作品名/解释/参数放封面页，每格只留自己的 note ──
    function filmBook(id) {
      var roll = (allFilms || []).filter(function (f) { return f.id === id; })[0];
      if (!roll) return null;
      return {
        kind: 'film',
        nav: 'film',
        roll: roll,
        docTitle: roll.title || roll.stock,
        entries: (roll.photos || []).slice(),
        cover: {
          titleZh: roll.title || '',        // 作者自定义作品名（可空）
          titleEn: roll.stock,              // 没有作品名时型号自己当主标题
          meta:    [roll.format, roll.camera, roll.lens, roll.date].filter(Boolean).join(' · '),
          lead:    roll.desc,
        },
        colophon: function (n) {
          return { zh: zhNumber(n) + '格', en: roll.stock + (roll.date ? ' · ' + roll.date : '') };
        },
        back: { href: 'film.html', text: '→ Back to Film' },
      };
    }

    // ── 开工：找不到就给一页说明 + 回对应板块的路 ──
    if (!spec) {
      var lost = params.get('year') ? ['没有找到这一年', 'archive.html', '→ Back to Archive']
               : params.get('film') ? ['没有找到这一卷', 'film.html', '→ Back to Film']
               :                      ['没有找到这个系列', 'gallery.html', '→ Back to Gallery'];
      var err = el('section', 'page flex flex-col items-center justify-center px-6 text-center');
      err.appendChild(el('p', 'font-zh text-lg', lost[0]));
      var errBack = el('a', 'font-display text-sm text-site-muted hover:text-site-text transition-colors mt-8', lost[2]);
      errBack.href = lost[1];
      err.appendChild(errBack);
      book.appendChild(err);
    } else {
      document.title = spec.docTitle + ' — Yang Photography';
      // 导航高亮：当前所在板块那一项用正文色，其余保持灰
      document.querySelectorAll('nav ul a').forEach(function (a) {
        a.className = a.getAttribute('href') === spec.nav + '.html'
          ? 'text-site-text'
          : 'hover:text-site-text transition-colors';
      });
      buildBook();
    }

    // ═══ 组装整本画册 ═══════════════════════════════════════════

    function buildBook() {
      var entries = spec.entries;

      // 照片总数（组图算一页）：给页码和版权页用
      var totalPhotos = entries.filter(function (e) { return e.src || e.group; }).length;

      // ── 封面页 ──
      var c = spec.cover;
      var cover = el('section', 'page flex flex-col items-center justify-center px-6 text-center');
      var h1 = el('h1');
      if (c.titleZh) {
        h1.appendChild(el('span', 'block font-zh text-4xl md:text-5xl leading-tight', c.titleZh));
        if (c.titleEn) h1.appendChild(el('span', 'block font-display text-xl md:text-2xl mt-4 text-site-muted', c.titleEn));
      } else if (c.titleEn) {
        // 没有中文标题时英文自己当主标题；Archive 的年份数字再大一号
        h1.appendChild(el('span', 'block font-display leading-none ' +
          (c.bigEn ? 'text-8xl md:text-9xl' : 'text-4xl md:text-5xl'), c.titleEn));
      }
      cover.appendChild(h1);
      if (c.meta) {
        cover.appendChild(el('p', (isZh(c.meta) ? 'font-zh' : 'font-display') +
          ' text-sm text-site-muted mt-6 tracking-wide', c.meta));
      }
      cover.appendChild(el('div', 'mt-10 h-px w-20 bg-site-border'));
      if (c.lead) {
        cover.appendChild(el('p', 'font-zh text-sm md:text-base leading-[2] mt-10 max-w-[30em] text-site-muted', c.lead));
      }
      book.appendChild(cover);

      // ── 正文页 ──
      var photoNo = 0;        // 照片页计数（页码 n / N）
      var panelSide = 'right';// 仅 PANEL_SIDE = 'alternate' 时使用：交替状态

      entries.forEach(function (entry) {
        if (entry.chapter) { book.appendChild(chapterPage(entry.chapter, entry.index)); return; }
        if (entry.blank)   { book.appendChild(el('section', 'page')); return; }   // 空白页：一整屏纯纸面的喘息
        if (entry.text)    { book.appendChild(textPage(entry.text)); return; }
        photoNo += 1;
        // Film 的照片嵌在片框里，其余板块共用通用图文模块
        book.appendChild(spec.kind === 'film'
          ? filmPhotoPage(entry, photoNo, totalPhotos)
          : photoPage(entry, photoNo, totalPhotos));
      });

      // ── 版权页 ──
      var colo = spec.colophon(totalPhotos);
      var end = el('section', 'page flex flex-col items-center justify-center px-6 text-center');
      end.appendChild(el('div', 'h-px w-20 bg-site-border mb-10'));
      end.appendChild(el('p', 'font-zh text-sm text-site-muted', colo.zh));
      end.appendChild(el('p', 'font-display text-sm text-site-muted mt-1', colo.en));
      end.appendChild(el('p', 'font-display text-2xl mt-8', 'Yang'));
      var back = el('a', 'inline-block font-display text-sm text-site-muted hover:text-site-text transition-colors mt-10', spec.back.text);
      back.href = spec.back.href;
      end.appendChild(back);
      book.appendChild(end);

      revealSetup();

      // ═══ 各种页的造法 ═════════════════════════════════════════

      // 章节扉页：大数字 + 中英章题 + 简介（有才显示）
      function chapterPage(ch, ci) {
        var sec = el('section', 'page flex flex-col items-center justify-center px-6 text-center');
        var wrap = el('div', 'zr');
        var num = String(ci + 1);
        wrap.appendChild(el('p', 'font-display text-6xl md:text-7xl text-site-muted', num.length < 2 ? '0' + num : num));
        wrap.appendChild(el('h2', 'font-zh text-2xl md:text-3xl mt-6', ch.titleZh));
        wrap.appendChild(el('p', 'font-display text-lg text-site-muted mt-2', ch.titleEn));
        if (ch.descZh) wrap.appendChild(el('p', 'font-zh text-sm leading-[2] mt-6 max-w-[28em] text-site-muted', ch.descZh));
        sec.appendChild(wrap);
        return sec;
      }

      // 独立文字页：一整页只放几句话
      function textPage(text) {
        var sec = el('section', 'page flex flex-col items-center justify-center px-6 text-center');
        sec.appendChild(el('p', 'zr font-zh text-lg md:text-xl leading-[2.2] max-w-[26em]', text));
        return sec;
      }

      // 照片页：按 layout（显式或自动）选图文模式
      function photoPage(photo, no, total) {
        // ① 显式指定优先；② 否则按已有字段语义走自动规则
        var layout = photo.layout;
        if (!layout) {
          if (photo.group)        layout = photo.desc ? 'group-text' : 'group';
          else if (photo.desc) {
            // 面板方向听顶部 PANEL_SIDE 开关的；'alternate' 才逐张交替
            if (PANEL_SIDE === 'alternate') {
              layout = 'panel-' + panelSide;
              panelSide = (panelSide === 'right' ? 'left' : 'right');
            } else {
              layout = 'panel-' + PANEL_SIDE;
            }
          }
          else if (photo.note)    layout = 'margin';
          else if (photo.caption) layout = 'caption';
          else                    layout = 'plain';
        }

        var sec = el('section', 'page flex flex-col px-6 pt-16 pb-5');
        var eager = (no === 1);            // 首张不懒加载也不做入场式
        var stage;

        if (layout === 'panel-right' || layout === 'panel-left') {
          // ── 左右面板（对开）：图占大头，文字面板在旁，垂直居中 ──
          stage = el('div', 'flex-1 min-h-0 flex flex-col ' +
            (layout === 'panel-right' ? 'md:flex-row' : 'md:flex-row-reverse') +
            ' items-center justify-center gap-6 md:gap-12 max-w-6xl mx-auto w-full');
          var imgBox = el('div', 'flex-1 min-h-0 flex items-center justify-center w-full' + (eager ? '' : ' zr'));
          imgBox.appendChild(makeImg(photo.src, photo.alt, '(min-width: 768px) 60vw, 92vw', eager));
          stage.appendChild(imgBox);
          var panel = el('div', 'shrink-0 w-full md:w-72 md:pb-6' +
            (layout === 'panel-left' ? ' md:text-right' : '') + (eager ? '' : ' zr zr-late'));
          if (photo.caption)  panel.appendChild(el('p', (isZh(photo.caption) ? 'font-zh' : 'font-display') + ' text-lg', photo.caption));
          var dl = [photo.date, photo.location].filter(Boolean).join(' · ');
          if (dl)             panel.appendChild(el('p', 'font-display text-sm text-site-muted mt-2 tracking-wide', dl));
          if (photo.desc)     panel.appendChild(el('p', 'font-zh text-sm leading-[2] text-site-muted mt-4', photo.desc));
          if (photo.meta)     panel.appendChild(el('p', 'font-display text-xs text-site-muted mt-3 tracking-wide', photo.meta));
          stage.appendChild(panel);
          sec.appendChild(stage);
          sec.appendChild(foot(null, no, total));

        } else if (layout === 'margin') {
          // ── 页边批注：文字缩到页边角落，小小一条 ──
          stage = el('div', 'flex-1 min-h-0 flex flex-col md:flex-row items-center md:items-end justify-center gap-6 md:gap-10 max-w-6xl mx-auto w-full');
          var note = el('div', 'order-2 md:order-1 shrink-0 w-full md:w-40 md:pb-10' + (eager ? '' : ' zr zr-late'));
          var noteText = [photo.caption, photo.note || photo.desc].filter(Boolean).join('\n');
          var noteP = el('p', 'font-zh text-xs leading-[2] text-site-muted');
          noteP.style.whiteSpace = 'pre-line';   // 换行符生效（JS 动态控制的例外）
          noteP.textContent = noteText;
          note.appendChild(noteP);
          stage.appendChild(note);
          var imgBox2 = el('div', 'order-1 md:order-2 flex-1 min-h-0 flex items-center justify-center w-full md:self-center' + (eager ? '' : ' zr'));
          imgBox2.appendChild(makeImg(photo.src, photo.alt, '(min-width: 768px) 70vw, 92vw', eager));
          stage.appendChild(imgBox2);
          sec.appendChild(stage);
          sec.appendChild(foot(null, no, total));

        } else if (layout === 'group' || layout === 'group-text') {
          // ── 组图：同屏并排（手机上下叠），共用一组文字 ──
          stage = el('div', 'flex-1 min-h-0 flex flex-col md:flex-row items-center justify-center gap-4 md:gap-6' + (eager ? '' : ' zr'));
          var maxW = photo.group.length > 2 ? 'md:max-w-[30vw]' : 'md:max-w-[44vw]';
          photo.group.forEach(function (g) {
            var im = makeImg(g.src, g.alt, '(min-width: 768px) 44vw, 92vw', eager);
            im.className = 'max-h-[38vh] md:max-h-full w-auto h-auto max-w-full ' + maxW;
            stage.appendChild(im);
          });
          sec.appendChild(stage);
          if (layout === 'group-text' || photo.caption) {
            var gt = el('div', 'shrink-0 text-center pt-4' + (eager ? '' : ' zr zr-late'));
            if (photo.caption) gt.appendChild(el('p', (isZh(photo.caption) ? 'font-zh' : 'font-display') + ' text-sm', photo.caption));
            if (photo.desc)    gt.appendChild(el('p', 'font-zh text-sm text-site-muted mt-1', photo.desc));
            sec.appendChild(gt);
          }
          sec.appendChild(foot(null, no, total));

        } else {
          // ── 图下注 / 纯照片页：照片独占，页脚放图注和页码 ──
          stage = el('div', 'flex-1 min-h-0 flex items-center justify-center' + (eager ? '' : ' zr'));
          var im2 = makeImg(photo.src, photo.alt, '92vw', eager);
          im2.className = 'max-w-[92vw] max-h-full w-auto h-auto';
          stage.appendChild(im2);
          sec.appendChild(stage);
          sec.appendChild(foot(layout === 'caption' ? photo.caption : null, no, total));
        }
        return sec;
      }

      // Film 的照片页：照片嵌在片框里（135 上下齿孔 + 片边字 / 120 素黑宽边）。
      // 卷级的作品名/解释/参数已经在封面页说过了，这里每格只留自己的 note，
      // 所以不做左右面板——一格就是一格，和放在灯箱上看底片一样
      function filmPhotoPage(photo, no, total) {
        var roll = spec.roll;
        var is120 = roll.format === '120';
        var sec = el('section', 'page flex flex-col px-6 pt-16 pb-5');
        var eager = (no === 1);

        var stage = el('div', 'flex-1 min-h-0 flex items-center justify-center' + (eager ? '' : ' zr'));
        var frame = el('div', 'film-frame bg-site-text');
        if (is120) frame.classList.add('f120');
        // 竖片查宽高表直接判断（不用等图片加载完再翻转齿孔，表里没有就当横片）
        var dim = ZINE_DIMS[photo.src];
        if (dim && dim[1] > dim[0]) frame.classList.add('portrait');

        var perfA = el('div', 'perf perf-a');
        var perfB = el('div', 'perf perf-b');
        if (!is120) { buildHoles(perfA); buildHoles(perfB); }
        frame.appendChild(perfA);

        // 片边字（font-shell = 物体表面印字的全站例外）：
        // 型号在左、画格编号在右；135 编号带 A，是真实底片的写法
        var band = el('div', 'edge-band font-shell text-site-bg');
        band.appendChild(el('span', '', roll.label || roll.stock));
        band.appendChild(el('span', '', no + (is120 ? '' : 'A')));
        frame.appendChild(band);

        var img = makeImg(photo.src, photo.alt || (roll.stock + ' 第 ' + no + ' 格'),
                          '(min-width: 768px) 80vw, 92vw', eager);
        img.className = '';   // 片框里的图由 .film-frame img 管尺寸，不用 Tailwind 那套
        frame.appendChild(img);
        frame.appendChild(perfB);

        stage.appendChild(frame);
        sec.appendChild(stage);
        sec.appendChild(foot(photo.note || '', no, total));
        return sec;
      }

      // 给齿孔带填一排孔：多填一些，靠 overflow:hidden 居中裁掉
      // （齿孔带宽度是被动跟随照片的，填多少不影响片框尺寸）
      function buildHoles(band) {
        for (var i = 0; i < 40; i++) {
          band.appendChild(el('span', 'hole bg-site-bg'));
        }
      }

      // 定高页脚：左 = 图注（可空），右 = 页码。高度固定，页码不随照片横竖跳动
      function foot(caption, no, total) {
        var f = el('div', 'page-foot h-12 shrink-0 flex items-baseline justify-between gap-6 max-w-4xl mx-auto w-full pt-3');
        f.appendChild(el('span', (isZh(caption) ? 'font-zh' : 'font-display') + ' text-sm text-site-muted truncate', caption || ''));
        f.appendChild(el('span', 'font-display text-xs text-site-muted tracking-widest shrink-0', no + ' / ' + total));
        return f;
      }
    }

    // ═══ 翻页浮现 ═══════════════════════════════════════════════
    // 页面滑到位时，带 .zr 的元素轻轻浮上来；每个元素只浮一次。
    // 两条路互为备份：IntersectionObserver 是正路；个别内嵌浏览器里 IO
    // 不可靠，所以滚动事件里再兜底查一遍——谁先发现"到视野了"谁点亮。

    function revealSetup() {
      var pending = Array.prototype.slice.call(document.querySelectorAll('.zr'));

      function show(t) {
        t.classList.add('on');
        var i = pending.indexOf(t);
        if (i > -1) pending.splice(i, 1);
        if (!pending.length) window.removeEventListener('scroll', onScroll);
      }

      if (!('IntersectionObserver' in window)) {
        // 老浏览器：不做动画，直接全部显示
        pending.slice().forEach(show);
        return;
      }

      var io = new IntersectionObserver(function (hits) {
        hits.forEach(function (hit) {
          if (hit.isIntersecting) { io.unobserve(hit.target); show(hit.target); }
        });
      }, { threshold: 0.35 });
      pending.forEach(function (t) { io.observe(t); });

      // 滚动兜底：元素进了视野中段就算到场（与 0.35 阈值同一精神）。
      // 节流用 setTimeout 而不是 requestAnimationFrame——要兜底的恰恰是
      // 渲染循环不正常的环境，rAF 在那种环境里同样不跑
      var ticking = false;
      function check() {
        ticking = false;
        var h = window.innerHeight;
        if (!h) return;
        pending.slice().forEach(function (t) {
          var r = t.getBoundingClientRect();
          if (r.top < h * 0.8 && r.bottom > h * 0.2) show(t);
        });
      }
      function onScroll() {
        if (!ticking) { ticking = true; setTimeout(check, 100); }
      }
      window.addEventListener('scroll', onScroll, { passive: true });
    }
  </script>

</body>
</html>
